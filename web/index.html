<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131e">
<title>Darts Console</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#f5faff;background:#050e18;--blue:#04bbff;--line:#344a5b;--muted:#a9bfce}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:not-allowed}
.console{width:min(100%,940px);min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 27%,#123049 0%,transparent 48%),linear-gradient(135deg,#07121e,#071422 70%,#050c15);border-left:1px solid #294358;border-right:1px solid #294358}
header{height:80px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 28px;border-bottom:1px solid #2b4254;background:#07121e}
.brand{display:flex;align-items:center;gap:16px;font-weight:850;letter-spacing:.02em;font-size:32px;white-space:nowrap}
.brand svg{width:45px;height:45px}
.status{color:#89d8ff;font-size:11px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 11px #05beff;margin-right:9px}
.workspace{display:grid;grid-template-columns:153px minmax(0,1fr);flex:1;min-height:0}
nav{padding:23px 12px;border-right:1px solid #294358;display:flex;flex-direction:column;gap:8px}
.nav{width:100%;min-height:80px;padding:12px 5px;border:1px solid transparent;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;color:#b9c9d6;font-size:13px;font-weight:700}
.nav svg{width:27px;height:27px}
.nav.active{border-color:#25caff;background:linear-gradient(130deg,#09bafd,#086bd8);box-shadow:0 0 18px #008af63b;color:#fff}
main{min-width:0;padding:28px 26px 32px}
.eyebrow{color:#70d4ff;letter-spacing:.17em;font-weight:850;font-size:11px}
h1{margin:7px 0;font-size:35px;letter-spacing:-.04em}
.subtitle{color:#b5c8d8;margin:0 0 25px;font-size:14px}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:#06111d;border:1px solid var(--line);border-radius:15px;margin-bottom:21px}
.switch button{border:0;border-radius:11px;background:transparent;color:#becdd9;min-height:46px;font-weight:800;font-size:14px}
.switch button.on{background:linear-gradient(135deg,#0cc4ff,#0875e8);box-shadow:0 0 16px #08aeff38;color:white}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;min-width:0;height:134px;padding:12px 7px;border-radius:16px;border:1px solid #405669;background:linear-gradient(140deg,#1b2d3b,#0d1825);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;text-align:center}
.tile svg{width:29px;height:29px}.tile strong{font-size:20px;line-height:1.07;letter-spacing:-.02em}.tile small{font-size:11px;color:#b9c9d4}
.tile.chosen{border:2px solid #03c5ff;background:linear-gradient(145deg,#15405c,#0b2031);box-shadow:0 0 18px #04a9ff49}
.tile.planned:after{content:"PLANNED";position:absolute;top:8px;right:9px;color:#8199aa;font-size:8px;font-weight:850;letter-spacing:.1em}
.details{margin-top:22px;border-radius:18px;border:1px solid #455b6e;background:linear-gradient(150deg,#122637,#0b1725);padding:22px;box-shadow:0 10px 25px #0005}
.detail-top{display:grid;grid-template-columns:37% 1fr;gap:15px}
.detail-title{border-left:4px solid var(--blue);padding:13px 12px 10px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:11px}
.detail-title strong{font-size:51px;line-height:1;letter-spacing:-.05em;overflow-wrap:anywhere}
.pill{display:inline-block;background:#087ce4;border-radius:7px;font-size:11px;padding:6px 9px;font-weight:850}
.detail-facts{border-left:1px solid #304a5e;padding-left:16px}
.fact{padding:7px 0;border-bottom:1px solid #2b4355;font-size:13px;display:flex;align-items:center;gap:9px}
.fact:last-child{border:0}.fact svg{width:18px;height:18px;flex-shrink:0}
.details p{color:#c5d3de;line-height:1.55;font-size:13px;margin:18px 0}
.primary{width:100%;min-height:55px;background:linear-gradient(#11c7ff,#0674e9);border:1px solid #3ad6ff;box-shadow:0 4px 18px #009cff49;border-radius:12px;font-weight:850;font-size:18px}
.primary:disabled{background:#2a3d4d;border-color:#486073;color:#a7b6c1;box-shadow:none}
footer{border-top:1px solid #34495c;min-height:87px;padding:16px 20px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:center;background:linear-gradient(#12202d,#07101b)}
.hint{display:flex;gap:9px;align-items:center;justify-content:center;font-weight:750;font-size:11px;color:#c7d4df}
.hint small{display:block;font-size:10px;color:#97aebd;font-weight:400;margin-top:3px}
.key{flex-shrink:0;display:grid;place-items:center;width:33px;height:33px;background:linear-gradient(140deg,#3a5267,#142533);border:1px solid #7690a3;border-radius:9px;font-size:17px}
.key.round{border-radius:50%;border:2px solid var(--blue)}
.panel{padding:20px;border:1px solid #41576a;border-radius:15px;background:linear-gradient(135deg,#162b3d,#0c1928);margin-bottom:16px}
.panel h2{font-size:18px;margin:0 0 16px}.panel p{color:#b6c9d8;font-size:14px;line-height:1.6}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.player{padding:16px 12px;border-radius:11px;background:#142536;border:1px solid #40596a;font-weight:800;text-align:left;display:flex;justify-content:space-between}
.player.checked{background:#0c3b59;border-color:#0bb9ff}.player span{color:#6ed6ff}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rule{padding:14px 5px;border:1px solid #496477;border-radius:9px;background:#102132;font-size:12px;font-weight:700}
.rule.checked{background:#0a4465;border-color:#02beff}
.action{width:100%;padding:17px;border:1px solid #41586b;border-radius:12px;background:#14293a;font-weight:750;text-align:left;display:flex;justify-content:space-between;margin-bottom:10px}
.action span{color:#47cafa}
.score-hero{position:relative;overflow:hidden;border:1px solid #2675a1;border-radius:19px;background:radial-gradient(circle at 75% 45%,#1f5577,transparent 55%),linear-gradient(120deg,#14324a,#071826);padding:27px 23px;margin:20px 0}
.score-hero:after{content:"";pointer-events:none;position:absolute;right:-77px;top:0;width:245px;height:245px;border:2px solid #159bd529;border-radius:50%;box-shadow:0 0 0 28px #149cd60e,0 0 0 52px #149cd608}
.score-hero strong{font-size:26px;display:block;margin-top:13px}
.big-score{font-size:clamp(76px,14vw,130px);font-weight:900;letter-spacing:-.07em;line-height:1.2}
.caption{color:#8dd8fb;letter-spacing:.13em;font-size:11px;font-weight:850}
.dart-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.dart-slots div{padding:12px 6px;text-align:center;border:1px dashed #50788f;border-radius:10px;color:#8ea8ba}
.dart-slots small{display:block;font-size:10px;margin-bottom:7px}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid #2b465a}
.score-row:last-child{border:0}.score-row.active{border:1px solid #188ac5;background:#123e56;border-radius:10px}
.score-row strong{font-size:24px}.score-row.active strong{color:#1bc7ff}
.note{background:#0e2434;border:1px solid #285065;border-radius:11px;padding:14px;margin:16px 0;color:#a9c8dc;font-size:13px;line-height:1.5}
.focused{outline:2px solid #07c4ff!important;outline-offset:-2px}
@media(max-width:680px){
header{height:65px;padding:0 12px}.brand{font-size:19px;gap:8px}.brand svg{width:32px;height:32px}.status{font-size:9px;letter-spacing:0}
.workspace{grid-template-columns:64px minmax(0,1fr)}nav{padding:12px 4px;gap:5px}.nav{min-height:62px;font-size:9px;padding:10px 2px}.nav svg{width:20px;height:20px}
main{padding:19px 12px 26px}h1{font-size:24px}.subtitle{font-size:12px;margin-bottom:17px}
.cards{gap:8px}.tile{height:105px;border-radius:11px;padding:7px 3px;gap:5px}.tile svg{width:21px;height:21px}.tile strong{font-size:12px}.tile small{font-size:9px}.tile.planned:after{font-size:6px;top:4px;right:4px}
.details{padding:12px}.detail-top{grid-template-columns:38% 1fr;gap:8px}.detail-title{padding:10px 6px}.detail-title strong{font-size:28px}.detail-facts{padding-left:8px}.fact{font-size:10px;padding:5px 0;gap:5px}.fact svg{width:13px;height:13px}.details p{font-size:11px}.primary{font-size:15px;min-height:48px}
footer{padding:10px 3px;min-height:68px;gap:2px}.hint{flex-direction:column;gap:4px;font-size:8px}.hint small{display:none}.key{width:25px;height:25px;font-size:13px}
.panel{padding:14px}.rules{grid-template-columns:1fr}
}
@media(max-width:350px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{font-size:16px}}
</style>
</head>
<body>
<div class="console">
<header>
<div class="brand"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" stroke="#f4f9ff" stroke-width="4" fill="#0b2232"/><circle cx="30" cy="30" r="20" stroke="#17a3bc" stroke-width="5" fill="none"/><circle cx="30" cy="30" r="13" stroke="#e7f0fa" stroke-width="5" fill="none"/><circle cx="30" cy="30" r="6" stroke="#53d6a4" stroke-width="3" fill="#e44b48"/><path d="M30 4v52 M4 30h52 M12 12l36 36 M48 12 12 48 M20 6l20 48 M6 20l48 20 M40 6 20 54 M54 20 6 40" stroke="#edf9ff" stroke-width="1.2"/></svg>DARTS CONSOLE</div>
<span class="status">OFFLINE DEMO</span>
</header>
<div class="workspace"><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main></div>
<footer aria-label="Physical button labels">
<div class="hint"><span class="key">↶</span><span>BACK<small>Esc</small></span></div>
<div class="hint"><span class="key">↩</span><span>UNDO<small>F4</small></span></div>
<div class="hint"><span class="key round">●</span><span>ROTATE / OK<small>Arrows · Enter</small></span></div>
<div class="hint"><span class="key">✎</span><span>CORRECT<small>F2</small></span></div>
<div class="hint"><span class="key">➜</span><span>NEXT<small>F5</small></span></div>
</footer>
</div>
<script>
const shapes={
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
users:'<circle cx="9" cy="7" r="4"/><path d="M2 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M16 4a4 4 0 0 1 0 7.5M18 14a5 5 0 0 1 4 5v1"/>',
chart:'<path d="M4 20v-6M10 20V9M16 20V4M22 20v-8"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-3 2v3l3 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 3-2v-3L1 9l2-4 3 1 3-1Z"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
trophy:'<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4ZM7 6H4v3a4 4 0 0 0 4 4M17 6h3v3a4 4 0 0 1-4 4"/>',
dart:'<path d="m5 19 14-14M13 5l6-2-2 6M5 19l-2 2 2-6M15 9l-4-4"/>',
crossed:'<path d="m5 19 14-14M19 19 5 5M13 5l6-2-2 6M5 5 3 3l6 2"/>',
arrows:'<path d="M4 7h16m-5-4 5 4-5 4M20 17H4m5-4-5 4 5 4"/>',
flame:'<path d="M12 22c4 0 7-3 7-7 0-3-2-6-5-9 .3 3-1 4-2 5-.5-3-1.5-5-3-7-1 4-4 7-4 11 0 4 3 7 7 7Z"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
ball:'<circle cx="12" cy="12" r="9"/><path d="M7 5c3 3 3 11 0 14M17 5c-3 3-3 11 0 14"/>',
percent:'<path d="M19 5 5 19"/><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/>',
triangle:'<path d="m12 3 10 18H2L12 3Z"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(shapes[name]||shapes.target)+'</svg>'}
const modes=[
['501','The classic','dart',501,'CLASSIC','Start at 501 and count down to exactly zero. Double Out is optional.'],
['Cricket','Tactical darts','crossed',0,'TACTICAL','Close 15 to 20 and bull while keeping your score ahead.'],
['Around the Clock','Hit 1 through 20','clock',0,'PRACTICE','Hit the numbers from 1 through 20 in order.'],
['High Score','Collect points','trophy',0,'EASY','Get the highest total over a fixed number of rounds.'],
['Baseball','9 innings','ball',0,'EASY','Each inning uses one target. Singles, doubles and triples score runs.'],
['Knockout','Last player standing','users',0,'PARTY','Outscore the previous player or lose a life.'],
['301','Quick countdown','target',301,'CLASSIC','A shorter countdown game: get to exactly zero.'],
['701','Longer matches','target',701,'CLASSIC','A longer countdown game for bigger matches.'],
['Killer','Everyone vs everyone','users',0,'PARTY','Become a killer and take lives from the other players.'],
['Shanghai','Precision counts','flame',0,'SKILL','Score on the current target. Hit a single, double and triple to win.'],
['Gotcha!','Reset your rivals','arrows',0,'PARTY','Reach 301 and reset opponents with a matching score.'],
['Halve-It','Avoid missing','percent',0,'SKILL','Miss the target three times and your running score is halved.'],
['Bermuda Triangle','Changing targets','triangle',0,'SKILL','A target-changing game with special rounds.'],
['Tic-Tac-Toe','Three in a row','grid',0,'TACTICAL','Claim three squares in a row by hitting target numbers.']
];
const saved=['Emre','Arber','Adnan','Atakan','Amir','Ali'];
const state={page:'play',filter:'all',chosen:'501',players:['Arber','Emre'],out:'Double Out',guest:0,order:[],scores:[],current:0,round:1,cursor:0,message:''};
const nav=document.getElementById('nav'),main=document.getElementById('main');
const currentMode=()=>modes.find(x=>x[0]===state.chosen)||modes[0];
function title(top,heading,sub){return '<div class="eyebrow">'+top+'</div><h1>'+heading+'</h1><p class="subtitle">'+sub+'</p>'}
function note(t){return '<div class="note" role="status">'+t+'</div>'}
function show(page){state.page=page;state.cursor=0;state.message='';render()}
function selectMode(mode){state.chosen=mode;render()}
function cards(){
const shown=state.filter==='quick'?modes.slice(0,6):modes;
const mode=currentMode();
let html=title('GAME LIBRARY','Choose a game','Select a mode and set up your match.');
html+='<div class="switch"><button data-nav data-action="quick" class="'+(state.filter==='quick'?'on':'')+'">Quick play</button><button data-nav data-action="all" class="'+(state.filter==='all'?'on':'')+'">All game modes</button></div>';
html+='<div class="cards">'+shown.map(m=>'<button class="tile '+(m[0]===state.chosen?'chosen ':'')+(m[3]?'':'planned')+'" data-nav data-mode="'+m[0]+'">'+icon(m[2])+'<strong>'+m[0]+'</strong><small>'+m[1]+'</small></button>').join('')+'</div>';
html+='<section class="details"><div class="detail-top"><div class="detail-title"><strong>'+mode[0]+'</strong><span class="pill">'+mode[4]+'</span></div><div class="detail-facts">';
html+='<div class="fact">'+icon('users')+' 1 or more players</div><div class="fact">'+icon('target')+(mode[3]?' Start at '+mode[3]+' points':' Mode-specific scoring')+'</div><div class="fact">'+icon('trophy')+(mode[3]?' Finish at exactly zero':' Rules documented')+'</div><div class="fact">'+icon('dart')+(mode[3]?' Optional Double Out':' Not in the demo yet')+'</div></div></div>';
html+='<p>'+mode[5]+'</p><button class="primary" data-nav data-action="setup" '+(mode[3]?'':'disabled')+'>'+(mode[3]?'▶ &nbsp; Set up match':'Coming later')+'</button></section>';
return html;
}
function setup(){
let html=title('MATCH SETUP',state.chosen+' · Players','Choose players. Match order is randomized at the start.');
html+='<div class="panel"><h2>Players · '+state.players.length+' selected</h2><div class="players">';
html+=saved.map(n=>'<button class="player '+(state.players.includes(n)?'checked':'')+'" data-nav data-player="'+n+'">'+n+'<span>'+(state.players.includes(n)?'✓':'+')+'</span></button>').join('');
html+='</div>';
html+=state.players.filter(n=>!saved.includes(n)).map(n=>'<button class="player checked" data-nav data-player="'+n+'">'+n+'<span>✓</span></button>').join('');
html+='<button class="action" data-nav data-action="guest" style="margin-top:15px">Add guest <span>＋</span></button></div>';
html+='<div class="panel"><h2>Checkout</h2><div class="rules">';
html+=['Straight Out','Double Out','Master Out'].map(r=>'<button class="rule '+(state.out===r?'checked':'')+'" data-nav data-rule="'+r+'">'+r+'</button>').join('');
html+='</div></div><button class="primary" data-nav data-action="begin">▶ &nbsp; Start match</button>';
return html;
}
function game(){
let html=title('MATCH IN PROGRESS',state.chosen+' · '+state.out,'Round '+state.round+' · Player '+(state.current+1)+' of '+state.order.length);
html+='<div class="score-hero"><span class="pill">NOW THROWING</span><strong>'+state.order[state.current]+'</strong><div class="big-score">'+state.scores[state.current]+'</div><div class="caption">POINTS REMAINING</div><div class="dart-slots">'+[1,2,3].map(n=>'<div><small>DART '+n+'</small>—</div>').join('')+'</div></div>';
html+='<section class="panel" style="padding:9px">'+state.order.map((n,i)=>'<div class="score-row '+(i===state.current?'active':'')+'"><span>'+n+'</span><strong>'+state.scores[i]+'</strong></div>').join('')+'</section>';
html+=note('Camera scoring is not connected. This is an interface preview; no throws are being recorded.');
html+='<button class="action" data-nav data-action="menu">Match menu <span>›</span></button>';
return html;
}
function simple(section,lead,text){
return title('DARTS CONSOLE',section,lead)+'<div class="panel"><p>'+text+'</p></div><button class="action" data-nav data-action="play">Back to games <span>›</span></button>';
}
function render(){
const active=['setup','game','menu','correction'].includes(state.page)?'play':state.page;
nav.innerHTML=[['play','Play','target'],['players','Players','users'],['stats','Statistics','chart'],['settings','Settings','settings'],['about','About','info']].map(n=>'<button class="nav '+(active===n[0]?'active':'')+'" data-nav data-action="'+n[0]+'">'+icon(n[2])+n[1]+'</button>').join('');
let html='';
switch(state.page){
case 'play':html=cards();break;
case 'setup':html=setup();break;
case 'game':html=game();break;
case 'menu':html=title('MATCH OPTIONS','Match menu','Choose what to do next.')+'<button class="action" data-nav data-action="resume">Resume match <span>›</span></button><button class="action" data-nav data-action="new">New match <span>›</span></button>';break;
case 'correction':html=simple('Correct a throw','Manual correction is not connected yet.','You will be able to select and correct recorded darts once the scoring engine is implemented.');html+='<button class="action" data-nav data-action="resume">Resume match <span>›</span></button>';break;
case 'players':html=title('PLAYER LIST','Players','Saved names for match setup.')+'<section class="panel"><div class="players">'+saved.map(n=>'<div class="player">'+n+'</div>').join('')+'</div></section>'+note('Guests can be added when setting up a match.');break;
case 'stats':html=simple('Statistics','Match statistics will follow with the scoring engine.','Average scores, checkout rates and game history are planned.');break;
case 'settings':html=simple('Settings','Offline console configuration.','Debian Linux, three cameras, Pico controls and a separate LED dimmer.');break;
case 'about':html=simple('About','A standalone darts console built from an old laptop.','This is an interactive UI prototype. Automatic hit detection is not integrated.');break;
}
if(state.message)html+=note(state.message);
main.innerHTML=html;focus();
}
function controls(){return [...document.querySelectorAll('[data-nav]:not(:disabled)')]}
function focus(){const a=controls();if(!a.length)return;state.cursor=Math.min(state.cursor,a.length-1);a.forEach((b,i)=>b.classList.toggle('focused',state.cursor===i))}
function move(d){const a=controls();if(!a.length)return;state.cursor=(state.cursor+d+a.length)%a.length;focus();const b=controls()[state.cursor];if(b.dataset.mode&&b.dataset.mode!==state.chosen)selectMode(b.dataset.mode);b.scrollIntoView({block:'nearest'})}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clickButton(b){
if(!b||b.disabled)return;state.cursor=Math.max(0,controls().indexOf(b));
if(b.dataset.mode){selectMode(b.dataset.mode);return}
if(b.dataset.player){const n=b.dataset.player;state.players=state.players.includes(n)?state.players.filter(v=>v!==n):[...state.players,n];render();return}
if(b.dataset.rule){state.out=b.dataset.rule;render();return}
const act=b.dataset.action;
if(act==='all'||act==='quick'){state.filter=act;state.cursor=0;render()}
else if(act==='setup')show('setup');
else if(act==='guest'){state.guest++;state.players.push('Guest '+state.guest);render()}
else if(act==='begin'){if(!state.players.length){state.message='Select at least one player.';render();return}state.order=shuffle(state.players);state.scores=state.order.map(()=>currentMode()[3]);state.current=0;state.round=1;show('game')}
else if(act==='resume')show('game');
else if(act==='menu')show('menu');
else if(act==='new')show('play');
else if(['play','players','stats','settings','about'].includes(act))show(act);
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-nav]');if(b)clickButton(b)});
document.addEventListener('keydown',e=>{
if(!['ArrowUp','ArrowDown','Enter','Escape','F2','F4','F5'].includes(e.key))return;
e.preventDefault();
if(e.key==='ArrowUp')move(-1);
else if(e.key==='ArrowDown')move(1);
else if(e.key==='Enter')clickButton(controls()[state.cursor]);
else if(e.key==='Escape'){if(state.page==='game')show('menu');else if(state.page==='menu'||state.page==='correction')show('game');else show('play')}
else if(e.key==='F2'&&state.page==='game')show('correction');
else if(e.key==='F4'&&state.page==='game'){state.message='Undo is not available until throws are recorded.';render()}
else if(e.key==='F5'&&state.page==='game'){state.message='Turn switching will be connected to the scoring engine.';render()}
});
render();
</script>
</body>
</html>
