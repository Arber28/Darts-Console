<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darts Console – Interface Demo</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #f5f5f5;
      background: #10151b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(460px, 100%);
      padding: 28px;
      background: #1c242d;
      border: 1px solid #39444e;
      border-radius: 20px;
    }

    h1 { margin-top: 0; }
    p, small { color: #aebac5; }

    button {
      font: inherit;
      color: #fff;
      background: #293542;
      border: 1px solid #526274;
      border-radius: 10px;
      padding: 13px;
      margin: 5px;
      cursor: pointer;
    }

    button.selected {
      outline: 3px solid #e7ae47;
      background: #405065;
    }

    .players { display: flex; flex-wrap: wrap; }
    .score { font-size: 2.6rem; font-weight: 700; }

    #status {
      margin: 20px 0 12px;
      padding: 12px;
      background: #121920;
      border-radius: 10px;
    }

    hr { border: 0; border-top: 1px solid #39444e; }
  </style>
</head>
<body>
  <main>
    <h1>Darts Console</h1>
    <p>Rotary encoder: Up / Down / Enter. Back: Esc · Undo: F4 · Correct: F2 · Next: F5.</p>
    <div id="screen"></div>
    <div id="status" aria-live="polite"></div>
    <small>Interface demo only. Camera detection and scoring are not connected yet.</small>
  </main>

  <script>
    const savedPlayers = ['Emre', 'Arber', 'Adnan', 'Atakan', 'Amir', 'Ali'];

    const state = {
      page: 'mode',
      mode: 501,
      out: 'Double Out',
      players: ['Arber', 'Emre'],
      cursor: 0,
      guest: 0,
      turn: 0,
      throws: [],
      scores: [],
      message: ''
    };

    const screen = document.querySelector('#screen');
    const status = document.querySelector('#status');
    let options = [];

    function shuffle(players) {
      const result = [...players];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function openPage(page) {
      state.page = page;
      state.cursor = 0;
      state.message = '';
      render();
    }

    function menuItem(label, action) {
      const index = options.push({ label, action }) - 1;
      const selected = state.cursor === index ? 'selected' : '';
      return `<button data-index="${index}" class="${selected}">${label}</button>`;
    }

    function startGame() {
      if (!state.players.length) {
        state.message = 'Select at least one player.';
        render();
        return;
      }

      state.players = shuffle(state.players);
      state.scores = state.players.map(() => state.mode);
      state.turn = 0;
      state.throws = [];
      openPage('game');
    }

    function render() {
      options = [];
      let html = '';

      if (state.page === 'mode') {
        html = '<h2>Choose game</h2>';
        for (const mode of [301, 501, 701]) {
          html += menuItem(String(mode), () => {
            state.mode = mode;
            openPage('out');
          });
        }
        html += '<p>More game modes are planned.</p>';
      }

      if (state.page === 'out') {
        html = '<h2>Checkout rule</h2>';
        for (const rule of ['Straight Out', 'Double Out', 'Master Out']) {
          html += menuItem(rule, () => {
            state.out = rule;
            openPage('players');
          });
        }
      }

      if (state.page === 'players') {
        html = '<h2>Choose players</h2>';
        html += '<p>Selected: ' + (state.players.join(', ') || 'None') + '</p>';
        html += '<div class="players">';

        for (const player of savedPlayers) {
          const checked = state.players.includes(player) ? '✓ ' : '';
          html += menuItem(checked + player, () => {
            state.players = state.players.includes(player)
              ? state.players.filter(name => name !== player)
              : [...state.players, player];
            render();
          });
        }

        html += '</div>';
        html += menuItem('Add guest', () => {
          state.players.push('Guest ' + ++state.guest);
          render();
        });
        html += menuItem('Start game', startGame);
      }

      if (state.page === 'game') {
        html = `<h2>${state.mode} · ${state.out}</h2>`;
        html += '<p>Order: ' + state.players.join(' → ') + '</p>';
        html += '<h3>Current player: ' + state.players[state.turn] + '</h3>';
        html += '<div class="score">' + state.scores[state.turn] + '</div><hr>';

        state.players.forEach((player, index) => {
          html += `<p>${player}: <strong>${state.scores[index]}</strong></p>`;
        });

        html += menuItem('Correct hit', () => openPage('correction'));
        html += menuItem('Game menu', () => openPage('menu'));
        html += '<p>Scores are placeholders until camera detection is connected.</p>';
      }

      if (state.page === 'correction') {
        html = '<h2>Correct hit</h2>';
        html += '<p>Choosing a past throw and recalculating scores will be added with the scoring engine.</p>';
        html += menuItem('Back to game', () => openPage('game'));
      }

      if (state.page === 'menu') {
        html = '<h2>Game menu</h2>';
        html += menuItem('Resume game', () => openPage('game'));
        html += menuItem('New game', () => openPage('mode'));
      }

      screen.innerHTML = html;
      status.textContent = state.message || 'Ready';

      screen.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          state.cursor = Number(button.dataset.index);
          options[state.cursor].action();
        });
      });

      screen.querySelector('.selected')?.scrollIntoView({ block: 'nearest' });
    }

    function moveSelection(direction) {
      if (!options.length) return;
      state.cursor = (state.cursor + direction + options.length) % options.length;
      render();
    }

    document.addEventListener('keydown', event => {
      const controls = ['ArrowDown', 'ArrowUp', 'Enter', 'Escape', 'F2', 'F4', 'F5'];
      if (!controls.includes(event.key)) return;
      event.preventDefault();

      if (event.key === 'ArrowDown') moveSelection(1);
      if (event.key === 'ArrowUp') moveSelection(-1);
      if (event.key === 'Enter') options[state.cursor]?.action();

      if (event.key === 'Escape') {
        if (state.page === 'game') openPage('menu');
        else if (state.page === 'correction' || state.page === 'menu') openPage('game');
        else if (state.page === 'players') openPage('out');
        else if (state.page === 'out') openPage('mode');
      }

      if (event.key === 'F2' && state.page === 'game') openPage('correction');

      if (event.key === 'F4' && state.page === 'game') {
        state.message = 'Undo is not available in this demo.';
        render();
      }

      if (event.key === 'F5' && state.page === 'game') {
        state.message = 'Next player is not available in this demo.';
        render();
      }
    });

    render();
  </script>
</body>
</html>
