<!doctype html>
<!-- Main release: monochrome console, checkout guidance, victory and hardware controls. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111214">
<title>Darts Console</title>
<style>:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;background:#111214;color:#f5f5f5;--accent:#ffffff;--line:#333539;--muted:#adafb4}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
.console{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#111214}
header{display:flex;align-items:center;min-height:clamp(70px,10vw,108px);padding:0 4.4vw;flex-shrink:0}
.brand{font-weight:650;font-size:clamp(21px,3.3vw,36px);letter-spacing:-.05em;display:flex;align-items:center;gap:14px}
.brand-mark{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.workspace{display:flex;flex-direction:column;flex:1;min-height:0}
main{min-height:0;min-width:0;flex:1;padding:4.4vw;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
main::-webkit-scrollbar{display:none}
h1{font-size:clamp(32px,6vw,66px);font-weight:600;letter-spacing:-.055em;line-height:1.08;margin:10px 0 18px}
.eyebrow{color:var(--muted);font-size:clamp(11px,1.7vw,18px);font-weight:550;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:clamp(16px,2.3vw,25px);line-height:1.45;margin:0 0 32px}
.home-heading{display:flex;align-items:end;justify-content:space-between;margin:1vw 0 3.2vw}
.home-heading h1{margin:0;font-size:clamp(40px,7.5vw,81px)}
.home-heading p{color:var(--muted);font-size:clamp(14px,2.1vw,23px);margin:0 0 .6vw}
.switch{display:flex;gap:12px;margin-bottom:24px}
.switch button{border:1px solid var(--line);background:transparent;padding:14px 24px;border-radius:50px;font-size:clamp(14px,2vw,22px);font-weight:550}
.switch button.on{background:#f5f5f5;border-color:#f5f5f5;color:#17181b}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:clamp(155px,22vw,238px);padding:clamp(20px,3vw,34px);text-align:left;border:1px solid #333539;border-radius:6px;background:#1b1d20;overflow:hidden}
.tile strong{font-size:clamp(26px,4.4vw,48px);font-weight:600;letter-spacing:-.05em;line-height:1.04;max-width:92%}
.tile.numeric strong{font-size:clamp(55px,9vw,98px);font-weight:550;letter-spacing:-.07em}
.tile small{font-size:clamp(14px,2vw,22px);color:var(--muted);margin-top:12px}
.tile .tile-arrow{position:absolute;right:25px;top:19px;color:#9599a2;font-size:32px;font-weight:400}
.tile.chosen{border-color:#7c8088}
.tile.focused{background:#f5f5f5;color:#17181b;outline:none!important;border-color:#f5f5f5}
.tile.focused small,.tile.focused .tile-arrow{color:#55585d}
.home-summary{display:flex;gap:24px;align-items:baseline;border-top:1px solid var(--line);padding-top:24px;margin-top:32px;color:var(--muted);font-size:clamp(16px,2.2vw,24px);line-height:1.5}
.home-summary strong{color:#f5f5f5;white-space:nowrap;font-weight:550}
.home-summary p{margin:0}
.primary,.action,.player,.rule{border:1px solid #44464b;background:#222428;border-radius:6px;font-size:clamp(17px,2.25vw,25px);padding:20px;font-weight:550}
.primary{width:100%;min-height:clamp(60px,8vw,88px);background:var(--accent);border-color:var(--accent);color:#17181b;font-weight:650}
.action{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:14px;gap:16px;min-height:72px}
.action span,.player span{color:var(--accent)}
.action.resume{background:transparent;margin-bottom:28px;border-color:#44464b}
.panel{padding:26px;border:1px solid var(--line);border-radius:6px;background:#1b1d20;margin-bottom:24px}
.panel h2{font-size:clamp(20px,2.65vw,29px);font-weight:550;margin:0 0 22px;letter-spacing:-.025em}
.panel p,.note{color:var(--muted);font-size:clamp(16px,2.2vw,24px);line-height:1.5}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{display:flex;align-items:center;justify-content:space-between;text-align:left;min-width:0;overflow-wrap:anywhere}
.player.checked,.rule.checked{background:#36383d;border-color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule{text-align:center;min-height:66px}
.segments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:10px}
.note{padding:18px;border-left:3px solid var(--accent);background:#25272b;margin:24px 0}
.focused{outline:3px solid var(--accent);outline-offset:-3px}
.primary.focused{outline-color:#44464b;outline-offset:-6px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
footer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:8px;min-height:clamp(76px,10vw,108px);border-top:1px solid var(--line);padding:14px 3vw;flex-shrink:0;background:#181a1d}
.hint{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(11px,1.6vw,18px);font-weight:550;color:#c2c4c9;white-space:nowrap}
.hint small{display:none}
.key{display:grid;place-items:center;border:1px solid #55585d;border-radius:5px;width:34px;height:34px;font-size:20px;color:#e5e6e8}
.key.round{border-radius:50%;border-color:var(--accent);color:var(--accent)}
.console[data-view="game"] nav{display:none}
.game-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
.game-heading h1{margin-bottom:0}
.game-meta{color:var(--muted);font-size:clamp(16px,2.2vw,24px);text-align:right}
.score-hero{background:#ededee;color:#17181b;padding:3.6vw;border-radius:6px;margin-bottom:24px;min-height:59vw;display:grid;grid-template-rows:auto auto 1fr auto auto}
.pill{font-size:clamp(12px,1.6vw,18px);letter-spacing:.08em;font-weight:650}
.score-hero strong{font-size:clamp(35px,6vw,66px);letter-spacing:-.04em;margin-top:16px;font-weight:600}
.big-score{font-size:clamp(100px,23vw,252px);letter-spacing:-.04em;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums;align-self:center}
.word-score{font-size:15vw}
.caption{font-size:clamp(12px,1.7vw,19px);letter-spacing:.08em;color:#55585d;font-weight:600}
.dart-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.dart-slots div{padding:16px 8px;border:1px solid #b6b8be;text-align:center;font-size:clamp(20px,3vw,33px);font-weight:650;border-radius:5px}
.dart-slots small{display:block;color:#62656b;font-size:clamp(11px,1.5vw,17px);margin-bottom:8px;letter-spacing:.08em}
.dart-slots .empty{color:#999ca4;border-style:dashed}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-bottom:1px solid var(--line);font-size:clamp(18px,2.6vw,29px)}
.score-row:last-child{border:0}
.score-row.active{background:#303238;border-radius:5px}
.score-row strong{font-size:clamp(22px,3.3vw,36px);font-weight:600}
.score-row.active strong{color:var(--accent)}
.marks{display:block;font-size:.7em;line-height:1.5;color:var(--muted);margin-top:6px}
.standings h2{font-size:18px;color:var(--muted)}
.match-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-actions button{margin:0}
.match-actions .primary,.match-actions .action:last-child:nth-child(even){grid-column:1/-1}
@media(max-width:600px){
  nav{gap:0}.nav{padding:15px 4px;min-height:56px}
  main{padding:5vw}.home-heading{align-items:start;flex-direction:column;gap:12px}
  .switch button{padding:10px 16px}.cards{gap:10px}.tile{padding:18px}.tile .tile-arrow{right:15px;top:10px;font-size:24px}
  .home-summary{gap:14px}.action,.rule,.player{padding:14px}.panel{padding:18px}
  .rules{gap:8px}.hint{flex-direction:column;gap:5px}.key{width:25px;height:25px;font-size:16px}
  .game-heading{gap:10px}.score-hero{padding:24px;min-height:390px}.dart-slots{gap:8px}
}
@media(prefers-reduced-motion:no-preference){
  button{transition:background-color 120ms,color 120ms,border-color 120ms}
}header{min-height:120px;border-bottom:0}
.brand{font-size:28px;color:#a9adb6;letter-spacing:-.03em}
.brand-mark{display:none}
.home-heading{margin:20px 0 42px}
.home-heading h1{font-size:clamp(38px,6.8vw,74px);font-weight:550}
.tile{border:0;border-radius:12px;min-height:clamp(170px,26vw,282px);padding:32px}
.tile .tile-arrow{display:none}
.tile.chosen{box-shadow:inset 0 0 0 1px #6d727c}
.tile.focused{box-shadow:none}
.tile strong{font-weight:550}
.home-summary{border:0;margin-top:30px;padding-top:0}
.switch{margin-bottom:28px}
.switch button{border-radius:7px}
footer{grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;padding:0 24px;gap:8px;min-height:132px;background:#181a1d}
.softkey{height:100%;min-height:100px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:600}
.softkey small{font-size:12px;letter-spacing:.1em;color:#92969e;font-weight:500}
.encoder-hint{display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;color:#c7cad0}
.encoder-hint small{display:block;margin-top:7px;font-size:14px;color:#92969e}
.encoder-dot{width:38px;height:38px;border:2px solid #80858f;border-radius:50%;flex-shrink:0}
@media(max-width:600px){
 header{min-height:80px}.brand{font-size:22px}.tile{padding:22px}
 footer{padding:0 8px;min-height:96px;gap:2px}.softkey{font-size:14px;min-height:90px}.softkey small{font-size:9px}
 .encoder-hint{font-size:10px;gap:4px}.encoder-hint small{font-size:9px}.encoder-dot{width:22px;height:22px}
}
header{justify-content:space-between;gap:24px}
#match-heading{font-size:clamp(22px,3.4vw,38px);font-weight:600;text-align:right;letter-spacing:-.035em}
.console[data-view="game"] main{padding-top:10px}
.game-meta{text-align:center;margin:0 0 26px;font-size:24px}
.score-hero{text-align:center;min-height:760px;padding:34px 28px;grid-template-rows:auto auto 1fr auto auto}
.score-hero strong{font-size:clamp(38px,6vw,66px)}
.big-score{font-size:clamp(130px,29vw,314px);line-height:1.1;letter-spacing:-.045em}
.big-score.word-score{font-size:18vw}
.dart-slots{margin-top:36px;gap:16px}
.dart-slot{min-height:200px;background:transparent;border:1px solid #aaaeb5;border-radius:10px;color:#16181c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 6px}
.dart-slot small{font-size:24px;letter-spacing:.06em;font-weight:550}
.dart-slot span{font-size:clamp(36px,7vw,76px);font-weight:650;letter-spacing:-.04em}
.dart-slot.empty{color:#747982;border-style:dashed}
.dart-slot:disabled{opacity:.6}
.dart-slot.focused{outline:3px solid #17191d;outline-offset:-3px}
.standings .score-row{padding:12px 18px}
@media(max-width:600px){
 .game-meta{font-size:16px;margin-bottom:20px}.score-hero{min-height:520px;padding:24px 14px}
 .dart-slot{min-height:130px}.dart-slot small{font-size:16px}.dart-slots{gap:8px}
}

/* Match-focused layout: preserve the neutral monochrome design. */
.console[data-view="game"] header{min-height:58px;padding:0 20px}
.console[data-view="game"] .brand{font-size:19px}
.console[data-view="game"] #match-heading{font-size:20px}
.console[data-view="game"] main{padding:6px 12px 12px;overflow-y:auto}
.console[data-view="game"] footer{min-height:76px;padding:0 9px}
.console[data-view="game"] .softkey{min-height:68px;font-size:16px;gap:5px}
.console[data-view="game"] .softkey small{font-size:10px}
.console[data-view="game"] .encoder-hint{font-size:12px}
.console[data-view="game"] .encoder-hint small{font-size:10px;margin-top:3px}
.console[data-view="game"] .encoder-dot{width:27px;height:27px}
.console[data-view="game"] .game-meta{font-size:clamp(12px,2vw,17px);margin:2px 0 8px;text-align:center;color:#b3b5b9}
.console[data-view="game"] .score-hero{min-height:clamp(320px,48dvh,590px);margin:0 0 10px;padding:12px 8px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:#ededee;color:#17181b}
.console[data-view="game"] .score-hero .pill{font-size:clamp(10px,1.5vw,15px);padding-top:3px;color:#575b60}
.console[data-view="game"] .score-hero strong{font-size:clamp(23px,4.8vw,43px);margin:2px 0 0;line-height:1.08}
.console[data-view="game"] .big-score{width:100%;font-size:clamp(110px,39vw,520px);font-weight:750;letter-spacing:-.075em;line-height:.92;margin:auto 0;text-align:center;font-variant-numeric:tabular-nums}
.console[data-view="game"] .big-score.word-score{font-size:clamp(82px,20vw,240px);letter-spacing:-.045em}
.console[data-view="game"] .caption{font-size:clamp(12px,1.8vw,18px);padding-bottom:3px;color:#56595f}
.console[data-view="game"] .turn-header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 8px;color:#c4c5c8;font-size:clamp(13px,2vw,18px);font-weight:600}
.console[data-view="game"] .turn-header strong{font-size:clamp(24px,5vw,48px);color:#f5f5f5;letter-spacing:-.04em}
.console[data-view="game"] .dart-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.console[data-view="game"] .dart-slot{min-width:0;min-height:clamp(92px,13dvh,142px);padding:7px 3px;gap:5px;background:#24262a;border:1px solid #50535a;color:#f5f5f5;border-radius:8px}
.console[data-view="game"] .dart-slot small{font-size:clamp(11px,1.8vw,16px);color:#b5b8bc}
.console[data-view="game"] .dart-slot span{font-size:clamp(29px,7.5vw,86px);font-weight:700;line-height:1.1;letter-spacing:-.04em}
.console[data-view="game"] .dart-slot.recorded{border-color:#e9e9ea;background:#34363b}
.console[data-view="game"] .dart-slot.empty{color:#777b81;border-style:dashed}
.console[data-view="game"] .standings{padding:8px 12px;margin-bottom:10px}
.console[data-view="game"] .standings h2{font-size:14px;margin:0 0 4px}
.console[data-view="game"] .standings .score-row{padding:6px 8px;font-size:clamp(15px,2.4vw,24px)}
.console[data-view="game"] .standings .score-row strong{font-size:clamp(20px,3.3vw,33px)}
.console[data-view="game"] .match-actions{gap:8px;margin-bottom:6px}
.console[data-view="game"] .match-actions button{min-height:48px;padding:10px;font-size:14px}
.throw-flash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(12,13,15,.91);pointer-events:none;text-align:center;animation:flashOut 1600ms ease-out forwards}
.throw-flash-inner{display:flex;flex-direction:column;align-items:center;gap:8px;animation:flashIn 1600ms ease-out forwards}
.throw-flash-label{font-size:clamp(18px,4vw,36px);font-weight:600;color:#c6c7ca;letter-spacing:.12em}
.throw-flash-hit{font-size:clamp(72px,35vw,490px);font-weight:750;line-height:1.05;letter-spacing:-.055em;color:#fff;white-space:nowrap;max-width:100%;}
.throw-flash-points{font-size:clamp(26px,7vw,68px);font-weight:650;color:#f5f5f5}
@keyframes flashIn{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.06)}55%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes flashOut{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* Compact portrait game screen. Rules live in the header, not a separate row. */

/* Finish assistance and a dedicated victory experience. */

/* Keep the rotary encoder indicator at the exact physical centre of the footer,
   independent of softkey widths and whether labels are present. */
.console footer{position:relative}
.console footer .home-encoder{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:clamp(42px,7vw,70px);
  height:clamp(42px,7vw,70px);
  display:grid;
  place-items:center;
  pointer-events:none;
}
.console footer .home-encoder svg{display:block;margin:auto;flex:none}

/* Fixed hardware coordinates: key 1, key 2, encoder, key 3, key 4. */
.console[data-view] footer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:1fr;column-gap:0;row-gap:0;align-items:stretch;justify-items:stretch;box-sizing:border-box;height:clamp(96px,10dvh,132px);min-height:0;max-height:clamp(96px,10dvh,132px);padding:0 clamp(8px,2vw,22px)}
.console[data-view] footer > *{box-sizing:border-box;min-width:0;width:100%;margin:0;grid-column:auto;justify-self:stretch;align-self:stretch}
.console[data-view] footer .softkey,.console[data-view] footer .stats-empty-softkey{display:flex;align-items:center;justify-content:center;text-align:center;height:100%;min-height:0;padding:4px 2px;overflow-wrap:anywhere;font-size:clamp(11px,1.8vw,22px);line-height:1.2}

.console[data-view] footer .softkey small{font-size:clamp(8px,1.1vw,12px);text-align:center}
.console[data-view] footer .home-encoder{position:static;left:auto;top:auto;transform:none;width:100%;height:100%;display:grid;place-items:center;margin:0;pointer-events:none}
.console[data-view] footer .home-encoder svg{display:block;margin:0 auto}
.console[data-view] footer .encoder-hint{display:grid;place-items:center;width:100%;height:100%;margin:0;gap:0;padding:0}
.console[data-view] footer .encoder-hint > span:last-child{display:none}
.console[data-view] footer .encoder-dot{margin:0}
.console[data-view] footer .home-indicator{display:block;align-self:center;height:clamp(7px,1.2dvh,12px)}
.console[data-view] footer > :nth-child(1){grid-column:1}
.console[data-view] footer > :nth-child(2){grid-column:2}
.console[data-view] footer > :nth-child(3){grid-column:3}
.console[data-view] footer > :nth-child(4){grid-column:4}
.console[data-view] footer > :nth-child(5){grid-column:5}

// Migrate older mixed-case profiles and match history to one canonical name.
const canonicalPlayerName=name=>String(name??'').trim().toLocaleUpperCase('de-DE');
function migrateUppercasePlayers(){
  let changed=false;
  const original=Array.isArray(data.profiles)?data.profiles:defaults;
  const profiles=[...new Set(original.map(canonicalPlayerName).filter(Boolean))];
  if(JSON.stringify(original)!==JSON.stringify(profiles)){data.profiles=profiles;changed=true;}
  const appearances=data.profileAppearance||{};
  const updated={};
  for(const [name,appearance] of Object.entries(appearances)){
    const key=canonicalPlayerName(name);
    if(key&&!Object.hasOwn(updated,key))updated[key]=appearance;
    if(name!==key)changed=true;
  }
  if(changed)data.profileAppearance=updated;
  const migrateMatch=match=>{
    if(!match||!Array.isArray(match.players))return;
    const players=match.players.map(canonicalPlayerName);
    if(JSON.stringify(match.players)!==JSON.stringify(players)){
      match.players=players;changed=true;
    }
  };
  if(Array.isArray(data.matches))data.matches.forEach(migrateMatch);
  migrateMatch(data.active);
  if(data.unfinished&&typeof data.unfinished==='object')
    Object.values(data.unfinished).forEach(migrateMatch);
  if(changed){
    try{localStorage.setItem(storage,JSON.stringify(data));}catch(e){console.warn('Unable to save uppercase player migration',e);}
  }
}

// Assign immutable match numbers once, including the existing local history.
// Deleted numbers are never reused.
function ensureMatchNumbers(){
  const all=[...data.matches,...(data.active&&Scoring.replay(data.active).winners!==null?[data.active]:[])];
  const completed=all.filter(m=>m&&Scoring.replay(m).winners!==null);
  let next=Math.max(1,Number(data.nextMatchNumber)||1);
  for(const match of completed){
    if(Number.isSafeInteger(match.historyNumber)&&match.historyNumber>0)
      next=Math.max(next,match.historyNumber+1);
  }
  const unnumbered=completed.map((match,i)=>({match,i})).filter(x=>!Number.isSafeInteger(x.match.historyNumber)||x.match.historyNumber<=0)
    .sort((a,b)=>(Number(a.match.started)||0)-(Number(b.match.started)||0)||a.i-b.i);
  for(const {match} of unnumbered)match.historyNumber=next++;
  if(data.nextMatchNumber!==next||unnumbered.length){
    data.nextMatchNumber=next;
    save();
  }
}

/* The scoring engine advances immediately on the third dart. Keep the completed
   three-dart visit visible until NEXT is pressed. This is presentation metadata,
   not a modification to the scoring event stream. Persisted for kiosk reloads. */
function turnReview(){
  const review=data.active?.uiTurnReview;
  if(!review || !Array.isArray(review.darts) || review.darts.length!==3)return null;
  const view=derived();
  if(view.winners!==null || data.active.events.length!==review.eventCount)return null;
  if(view.current!==review.nextPlayer || view.round!==review.nextRound)return null;
  return review;
}
function clearTurnReview(){
  if(data.active)delete data.active.uiTurnReview;
}
function recordMatchDart(n,m){
  if(!data.active||derived().winners!==null||turnReview())return false;
  const before=derived();
  const index=data.active.events.length;
  Scoring.record(data.active,n,m);
  const after=derived();
  if(before.darts.length===2&&after.winners===null&&
     (before.current!==after.current||before.round!==after.round)){
    const darts=[...before.darts,{n,m}];
    data.active.uiTurnReview={
      player:before.current,round:before.round,darts,
      indices:[...before.history.slice(-2).map(x=>x.index),index],
      nextPlayer:after.current,nextRound:after.round,eventCount:data.active.events.length,
      total:darts.reduce((sum,d)=>sum+d.n*d.m,0)
    };
  }else clearTurnReview();
  save();
  show('game');
  if(after.winners!==null)announceVictory(before.winners);
  else if(!turnReview())showThrowFeedback(n,m);
  return true;
}

function addSetupGuest(){
  let number=state.guests.length+1;
  while([...data.profiles,...state.guests].includes('GAST '+number))number++;
  const guest='GAST '+number;
  state.guests.push(guest);
  if(!state.players.includes(guest))state.players.push(guest);
  render(false);
  state.cursor=controls().findIndex(b=>b.dataset.action==='player:'+guest);
  if(state.cursor<0)state.cursor=0;
  highlight(true);
}

const checkoutDarts=[];
for(let n=1;n<=20;n++)for(let m=1;m<=3;m++){
  const d=['','S','D','T'][m]+n;
  checkoutDarts.push({label:d,points:n*m,finishes:m===2});
}
checkoutDarts.push({label:'25',points:25,finishes:false},{label:'BULL',points:50,finishes:true});
function twoDartCheckout(score){
  const preferred=['D20','D16','D18','D12','D10','D8','D14','D6','D4','D2','D1','BULL'];
  const options=[];
  for(const a of checkoutDarts)for(const b of checkoutDarts){
    if(a.points+b.points===score && b.finishes)options.push([a,b]);
  }
  options.sort((x,y)=>{
    const rank=r=>{
      const finish=preferred.indexOf(r[1].label);
      return (finish<0?20:finish)*100+
        (r[0].label.startsWith('T')?0:r[0].label.startsWith('S')?10:20)+
        (r[0].label==='BULL'?50:0);
    };
    return rank(x)-rank(y);
  });
  return options.length?options[0].map(d=>d.label):null;
}
function checkoutRoute(score,dartsLeft,out){
  if(!Number.isInteger(score)||score<1||dartsLeft<1)return null;
  if(out!=='Double Out')return computedCheckoutRoute(score,dartsLeft,out);
  if(score<2||score>170)return null;
  const route=professionalCheckoutChart.get(score);
  if(route===null)return null; // Bogey / impossible 3-dart finish.
  if(route && route.length<=dartsLeft)return route.slice();
  if(dartsLeft===1){
    return checkoutDarts.find(d=>d.points===score&&d.finishes)?.label
      ?[checkoutDarts.find(d=>d.points===score&&d.finishes).label]:null;
  }
  if(dartsLeft===2)return twoDartCheckout(score);
  return null;
}
function computedCheckoutRoute(score, dartsLeft, out){
  if(!Number.isInteger(score)||score<1||score>180||dartsLeft<1)return null;
  const all=[];
  for(let n=1;n<=20;n++)for(let m=1;m<=3;m++)all.push({n,m,points:n*m,label:Scoring.label(n,m)});
  for(let m=1;m<=2;m++)all.push({n:25,m,points:25*m,label:m===2?'BULL':'25'});
  const finish=d=>out==='Straight Out'||d.m===2||(out==='Master Out'&&d.m===3);
  // Keep the specifically useful two-dart route visible for 43.
  if(score===43&&out==='Double Out'&&dartsLeft>=2)return ['S13','D15'];
  const priority=d=>{
    const fav={D20:0,D16:1,D12:2,D10:3,D8:4,D18:5,D15:6,D6:7,D4:8,D2:9,D1:10,BULL:12};
    return fav[d.label]??(d.m===2?18:d.m===1?24:28);
  };
  const route=(remaining,count)=>{
    if(count===1){
      return all.filter(d=>d.points===remaining&&finish(d))
        .sort((a,b)=>priority(a)-priority(b))[0]||null;
    }
    const candidates=[];
    for(const d of all){
      if(d.points>=remaining)continue;
      // For low finishes favor clean singles before doubles/triples as setup darts.
      const rest=route(remaining-d.points,count-1);
      if(rest)candidates.push({d,rest});
    }
    candidates.sort((a,b)=>{
      const rank=x=>{
        const finalDart=x.rest.route?.at(-1)||x.rest;
        // Prefer familiar doubles (D20, D16...) over a harder bull finish.
        const setupPenalty=x.d.m===1?0:x.d.m===2?8:14;
        return priority(finalDart)*5+setupPenalty+(x.d.n===25?15:0);
      };
      return rank(a)-rank(b);
    });
    return candidates[0]?{route:[candidates[0].d,...(candidates[0].rest.route||[candidates[0].rest])],
      routeScore:priority(candidates[0].rest.route?.at(-1)||candidates[0].rest)}:null;
  };
  for(let count=1;count<=Math.min(3,dartsLeft);count++){
    const found=route(score,count);
    if(found)return (found.route||[found]).map(d=>d.label);
  }
  return null;
}
function finishAdvice(mode,view,match){
  if(['301','501','701'].includes(mode)){
    const p=view.players[view.current];
    const dartsLeft=3-view.darts.length;
    const route=checkoutRoute(p.score,dartsLeft,match.options.out||'Double Out');
    return route?{route:route.join(' → '),detail:'CHECKOUT · '+p.score}:
      (match.options.out==='Double Out' && p.score<=170 && p.score>=2 &&
       professionalCheckoutChart.get(p.score)===null && dartsLeft===3
       ?{route:'NO DIRECT FINISH',detail:'SET UP A DOUBLE'}:null);
  }
  if(mode==='Around the Clock'){
    const p=view.players[view.current];
    const target=p.target===21?'BULL':p.target;
    return {route:String(target),detail:'NEXT TARGET'};
  }
  if(mode==='Cricket'){
    const p=view.players[view.current];
    const targets=[20,19,18,17,16,15,25];
    const t=targets.find(n=>(p.marks[n]||0)<3);
    return t?{route:t===25?'BULL':String(t),detail:'TARGET TO CLOSE'}:null;
  }
  return null;
}

function turnPointsForDisplay(view,review,mode){
  const darts=review?review.darts:view.darts;
  if(!darts.length)return 0;
  // The sum is the recorded dart value. Busts restore the score in Scoring.replay.
  if(view.notice?.includes('busted'))return 0;
  return darts.reduce((sum,dart)=>sum+dart.n*dart.m,0);
}

/* Schematic board only: marker positions show the correct ring and segment,
   not a camera-measured impact coordinate. */
const boardNumbers=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
function boardPoint(r,d){const a=(d-90)*Math.PI/180;return [200+r*Math.cos(a),200+r*Math.sin(a)]}
function boardWedge(inside,outside,a,b){
  const p=boardPoint(outside,a),q=boardPoint(outside,b),r=boardPoint(inside,b),t=boardPoint(inside,a);
  return 'M'+p.join(' ')+' A'+outside+' '+outside+' 0 0 1 '+q.join(' ')+
    ' L'+r.join(' ')+' A'+inside+' '+inside+' 0 0 0 '+t.join(' ')+' Z';
}
function boardTarget(text){
  const s=String(text||'').toUpperCase().trim();
  if(['BULL','INNER BULL','D25'].includes(s))return {n:25,m:2};
  if(['25','OUTER BULL','S25'].includes(s))return {n:25,m:1};
  const x=/^([SDT])?([1-9]|1[0-9]|20)$/.exec(s);
  return x?{n:+x[2],m:({S:1,D:2,T:3})[x[1]]||1}:null;
}
function boardSuggestions(mode,view,match,review){
  if(review)return [];
  const tip=finishAdvice(mode,view,match);
  if(tip&&tip.route!=='NO DIRECT FINISH')return tip.route.split(' → ').map(boardTarget).filter(Boolean);
  if(['Shanghai','Baseball'].includes(mode))return [{n:view.round,m:1}];
  if(mode==='Halve-It')return [{n:[20,19,18,17,16,15,25][view.round-1],m:1}];
  if(mode==='Killer')return [{n:view.players[view.current].number,m:1}];
  if(mode==='Bermuda Triangle'){const t=match.options.sequence?.[view.round-1];return t?.n?[{n:t.n,m:t.m||1}]:[]}
  return [];
}
function matchBoard(mode,view,match,review,darts){
  const tips=boardSuggestions(mode,view,match,review),first=tips[0];
  const cls=(n,m)=>tips.some(t=>t.n===n&&t.m===m)?(first?.n===n&&first.m===m?' board-current':' board-later'):'';
  let svg='<svg class="match-board" viewBox="0 0 400 400" role="img" aria-label="Dartboard with suggested targets and recorded darts">';
  svg+='<circle cx="200" cy="200" r="186" fill="#171819" stroke="#888" stroke-width="2"/>';
  boardNumbers.forEach((n,i)=>{
    const a=i*18-9,b=i*18+9,light=i%2===1;
    [[27,91,1],[91,100,3],[100,143,1],[143,153,2]].forEach(([inner,outer,m,],j)=>{
      const color=(j===1||j===3)?(light?'#27795b':'#a83d45'):(light?'#c8c3b5':'#252628');
      svg+='<path class="board-wedge'+cls(n,m)+'" d="'+boardWedge(inner,outer,a,b)+'" fill="'+color+'" stroke="#858585" stroke-width=".75"/>';
    });
    const [x,y]=boardPoint(171,i*18);
    svg+='<text class="board-number" x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle">'+n+'</text>';
  });
  svg+='<circle cx="200" cy="200" r="25" fill="#242526" stroke="#aaa"/>';
  svg+='<circle class="board-wedge'+cls(25,1)+'" cx="200" cy="200" r="16" fill="#27795b"/>';
  svg+='<circle class="board-wedge'+cls(25,2)+'" cx="200" cy="200" r="7" fill="#a83d45"/>';
  darts.forEach((d,i)=>{
    if(d.n===0)return;
    const idx=boardNumbers.indexOf(d.n);
    if(d.n!==25&&idx<0)return;
    const pt=d.n===25?(d.m===2?[200,200]:boardPoint(12,i*110)):
      boardPoint(d.m===2?148:d.m===3?96:i%2?119:57,idx*18+(i-1)*2.2);
    svg+='<g class="board-marker"><circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="10" fill="#141517" stroke="#fff" stroke-width="2.5"/>'+
      '<text x="'+pt[0]+'" y="'+(pt[1]+3.5)+'" text-anchor="middle" fill="#fff" font-weight="800" font-size="11">'+(i+1)+'</text></g>';
  });
  return '<section class="match-board-area">'+svg+'</svg></section>';
}

function statsData(){
  ensureMatchNumbers();
  const matches=[...data.matches,...(data.active&&Scoring.replay(data.active).winners!==null?[data.active]:[])]
    .filter(match=>match&&Scoring.replay(match).winners!==null)
    .map((match,index)=>({match,index}))
    .sort((a,b)=>{
      // Newest first. Keep insertion order as tie-breaker for equal/missing timestamps.
      const timeA=Number(a.match.started)||0;
      const timeB=Number(b.match.started)||0;
      return timeB-timeA||b.index-a.index;
    }).map(entry=>entry.match);
   const players=new Map(data.profiles.map(name=>[name,{name,played:0,wins:0,points:0,darts:0,oneEighties:0,bestTurn:0}]));
  let points=0,darts=0,oneEighties=0,bestTurn=0;
  const games=matches.map(match=>{
    const view=Scoring.replay(match);
    const winner=view.winners.map(i=>match.players[i]).join(' & ')||'Unentschieden';
    const validDate=new Date(match.started);
    const date=Number.isFinite(validDate.getTime())?validDate.toLocaleDateString('de-DE'):'–';
    match.players.forEach((name,i)=>{
      if(!players.has(name))players.set(name,{name,played:0,wins:0,points:0,darts:0,oneEighties:0,bestTurn:0});
      const entry=players.get(name);
      entry.played++;
      if(view.winners.includes(i))entry.wins++;
      // 3-dart average is meaningful for countdown games, not for Cricket/Killer.
      if(['301','501','701'].includes(match.mode)){
        const throws=view.history.filter(d=>d.player===i);
        for(const d of throws){entry.darts++;entry.points+=d.n*d.m;darts++;points+=d.n*d.m}
        // Inspect the actual completed 3-dart turns, not arbitrary neighboring darts.
        const turnDarts=new Map();
        for(const evt of match.events||[]){
          if(evt.type!=='throw'||evt.player!==i)continue;
          const key=String(evt.round)+':'+String(evt.player)+':'+String(evt.slot===0?evt._index??'':evt._index??'');
        }
        const events=match.events||[];
        for(let j=0;j<events.length;j++){
          const e=events[j];
          if(e.type!=='throw'||e.player!==i||e.slot!==0)continue;
          const group=[e];
          for(let k=j+1;k<events.length&&group.length<3;k++){
            const next=events[k];
            if(next.type==='throw'&&next.player===i&&next.round===e.round&&next.slot===group.length)group.push(next);
            else if(next.type==='throw'||next.type==='next')break;
          }
          if(group.length===3){
            const total=group.reduce((sum,d)=>sum+d.n*d.m,0);
            entry.bestTurn=Math.max(entry.bestTurn,total);bestTurn=Math.max(bestTurn,total);
            if(group.every(d=>d.n===20&&d.m===3)){entry.oneEighties++;oneEighties++}
          }
        }
      }
    });
    return {number:match.historyNumber,mode:match.mode,date,players:match.players,winner};
  });
  const ranking=[...players.values()].sort((a,b)=>
    (b.darts?3*b.points/b.darts:-1)-(a.darts?3*a.points/a.darts:-1)||b.wins-a.wins||a.name.localeCompare(b.name));
  return {games,ranking,summary:{matches:matches.length,avg:darts?(3*points/darts).toFixed(1):'–',oneEighties,bestTurn}};
}

function statsActivity(games){
  // The chart only plots actual completed matches, grouped by recorded game mode.
  const totals=new Map();
  for(const game of games)totals.set(game.mode,(totals.get(game.mode)||0)+1);
  const rows=[...totals].sort((a,b)=>b[1]-a[1]).slice(0,5);

function statisticsRecords(){
  const {ranking}=statsData();
  const active=ranking.filter(p=>p.played>0);
  const max=(list,measure)=>{
    if(!list.length)return {value:null,holders:[]};
    const highest=Math.max(...list.map(measure));
    return {value:highest,holders:list.filter(p=>measure(p)===highest).map(p=>p.name)};
  };
  const bestTurn=max(active.filter(p=>p.bestTurn>0),p=>p.bestTurn);
  const best180=max(active.filter(p=>p.oneEighties>0),p=>p.oneEighties);
  const avgPlayers=active.filter(p=>p.darts>0);
  const bestAverage=max(avgPlayers,p=>3*p.points/p.darts);
  const mostWins=max(active.filter(p=>p.wins>0),p=>p.wins);
  const bestWinrate=max(active,p=>p.wins/p.played);
  const mostPlayed=max(active,p=>p.played);
  const records=[
    ['HÖCHSTE AUFNAHME',bestTurn.value,bestTurn.holders,'integer'],
    ['MEISTE 180er',best180.value,best180.holders,'integer'],
    ['BESTER 3-DART AVG',bestAverage.value,bestAverage.holders,'decimal'],
    ['MEISTE SIEGE',mostWins.value,mostWins.holders,'integer'],
    ['BESTE SIEGQUOTE',bestWinrate.value,bestWinrate.holders,'percent'],
    ['MEISTE MATCHES',mostPlayed.value,mostPlayed.holders,'integer']
  ];
  const format=(value,type)=>value===null?'–':
    type==='decimal'?value.toFixed(1):type==='percent'?(value*100).toFixed(0)+' %':String(value);
  return '<div class="stats-dashboard"><div class="stats-records">'+
    records.map(([label,value,holders,type])=>
      '<div class="stats-record"><span>'+label+'</span><strong>'+format(value,type)+'</strong>'+
      '<small class="stats-record-owner">'+(holders.length?esc(holders.join(' · ')):'Noch kein Rekord')+'</small></div>'
    ).join('')+'</div></div>';
}

function savePlayerProfile(){
  const name=canonicalPlayerName(state.name);
  if(!name)return say('Bitte einen Namen eingeben.');
  if(isGuestPlayer(name))return say('GAST-Namen sind für temporäre Spieler reserviert.');
  if([...data.profiles,...state.guests].some(n=>n!==state.editOriginal&&n.toLowerCase()===name.toLowerCase()))
    return say('Diesen Spielernamen gibt es schon.');
  data.profileAppearance=data.profileAppearance||{};
  if(state.editOriginal!==null){
    const before=state.editOriginal;
    if(before!==name)delete data.profileAppearance[before];
    const index=data.profiles.indexOf(before);
    if(index<0)return show('players');
    data.profiles[index]=name;
    const renameMatch=match=>{
      if(!match)return;
      match.players=match.players.map(n=>n===before?name:n);
    };
    data.matches.forEach(renameMatch);
    renameMatch(data.active);
    Object.values(data.unfinished).forEach(renameMatch);
    state.players=state.players.map(n=>n===before?name:n);
    state.selectedProfile=index;
  }else{
    data.profiles.push(name);
    state.selectedProfile=data.profiles.length-1;
  }
  data.profileAppearance[name]={icon:state.editIcon,color:state.editColor};
  state.editOriginal=null;save();
  show('players');
}

function fitMainScore(){
  const number=document.querySelector('.console[data-view="game"] .big-score');
  const card=number?.closest('.score-hero');
  if(!number||!card)return;
  const text=number.textContent.trim();
  const style=getComputedStyle(number);
  const ctx=document.createElement('canvas').getContext('2d');
  if(!ctx||!text)return;

  // The number must fill the *width* of the scorecard, not be capped by
  // an undersized fixed card height. Keep a small safety margin for glyphs.
  const availableWidth=Math.max(80,card.clientWidth-24)*.97;
  const heading=card.querySelector('.throwing-line');
  const caption=card.querySelector('.caption');
  const verticalSpace=Math.max(60,card.clientHeight-(heading?.offsetHeight||0)-
    (caption?.offsetHeight||0)-16);
  const heightLimit=verticalSpace*.99;
  const letterSpacing=text.length>3||/[^0-9]/.test(text)?-.045:-.075;
  let low=32,high=1100;
  for(let i=0;i<24;i++){
    const size=(low+high)/2;
    ctx.font=style.fontWeight+' '+size+'px '+style.fontFamily;
    const width=ctx.measureText(text).width+letterSpacing*size*Math.max(0,text.length-1);
    if(width<=availableWidth&&size*.96<=heightLimit)low=size;
    else high=size;
  }
  number.style.fontSize=low.toFixed(1)+'px';
}
window.addEventListener('resize',fitMainScore);

async function refreshWifi(){
  state.networkBusy=true;
  state.network={state:'unknown',networks:[],message:'Suche läuft …'};
  render(false);
  try{
    const response=await fetch('/api/network/scan',{cache:'no-store'});
    const json=await response.json();
    if(!response.ok)throw Error(json.error||'WLAN-Dienst nicht verfügbar');
    state.network={state:json.connected?'connected':'ready',networks:json.networks||[],message:json.connected?'Verbunden mit '+json.connected:'Netzwerke gefunden'};
  }catch(e){
    state.network={state:'unsupported',networks:[],message:'Direkte WLAN-Einrichtung ist in diesem Browser noch nicht verfügbar.'};
  }
  state.networkBusy=false;
  if(state.page==='settings-network')render(false);
}
async function connectWifi(){
  const password=state.networkPassword||'';
  if(!state.networkSsid)return;
  if(!password && state.network.networks?.some(n=>n.ssid===state.networkSsid&&n.security)){
    return say('Bitte das WLAN-Passwort eingeben.');
  }
  state.networkBusy=true;
  try{
    const res=await fetch('/api/network/connect',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Darts-Network':'requested'},
      body:JSON.stringify({ssid:state.networkSsid,password})
    });
    const json=await res.json();
    if(!res.ok)throw Error(json.error||'Verbindung fehlgeschlagen');
    state.networkSsid='';
    state.networkPassword='';
    state.network={state:'connected',networks:[],message:'Verbindung hergestellt.'};
    await refreshWifi();
    show('settings-network');
  }catch(e){
    state.network={...state.network,state:'error',message:e.message};
  }
  state.networkBusy=false;
  if(state.page==='settings-network'||state.page==='settings-wifi-password')render(false);
}
function updatePanel(){
  let html=panel('Software update',
    '<p>Install the latest version from the GitHub main branch. Saved matches and player profiles are preserved.</p>'+
    '<p class="update-status" role="status">'+esc(state.updateInfo)+'</p>');
  if(state.updateConfirm){
    html+=button('update-confirm','Confirm installation','primary')+
      button('update-cancel','Cancel');
  } else {
    html+=button('update-start',state.updateBusy?'Installing update…':'Update from GitHub',
      'action',state.updateBusy);
  }

}
async function startSoftwareUpdate(){
  if(state.updateBusy)return;
  state.updateConfirm=false;
  state.updateBusy=true;
  state.updateInfo='Contacting the local update service…';
  render();
  try{
    const response=await fetch('/api/update/start',{
      method:'POST',
      headers:{'X-Darts-Update':'requested'}
    });
    const payload=await response.json();
    if(!response.ok)throw new Error(payload.error||'The update service is unavailable');
    state.updateInfo='Checking GitHub for the latest version…';
    render();
    const requestedAt=Math.floor(Date.now()/1000);
    let attempts=0;
    const poll=async ()=>{
      try{
        if(++attempts>75)throw Error('Update status timed out; check the service logs');
        const result=await fetch('/api/update/status',{cache:'no-store'});
        if(!result.ok)throw Error('Cannot read update status');
        const status=await result.json();
        if(status.updated_at && status.updated_at<requestedAt-2){
          setTimeout(poll,1200);
          return;
        }
        const stage=status.state||'starting';
        state.updateInfo=status.message||stage;
        if(['updated','up-to-date','error'].includes(stage)){
          state.updateBusy=false;
          if(stage==='updated'){
            state.updateInfo='Installed successfully. Reloading the console…';
            render();
            setTimeout(()=>location.reload(),1300);
            return;
          }
          render();
          return;
        }
        render();
        setTimeout(poll,1200);
      }catch(error){
        state.updateBusy=false;
        state.updateInfo='Status check failed: '+error.message;
        render();
      }
    };
    setTimeout(poll,1100);
  }catch(error){
    state.updateBusy=false;
    state.updateInfo='Update unavailable: '+error.message;
    render();
  }
}

function render(scroll=false){
  document.querySelector('.console').dataset.view=state.page;

  const sectionHeadings={players:'Players',stats:'Statistics','stats-players':'Players','stats-player-detail':'Player','stats-records':'Records','stats-history':'History','stats-match-detail':'Match','stats-delete-confirm':'Löschen','player-delete':'Löschen',profile:'Players','profile-icons':'Players','profile-colors':'Players',settings:'Settings','settings-scoring':'Scoring','settings-display':'Darstellung','settings-network':'Netzwerk','settings-wifi-password':'WLAN','settings-system':'Software',about:'About'};
  document.getElementById('match-heading').textContent=sectionHeadings[state.page]||

    profile:profileEditor,'profile-icons':profileIconsPage,'profile-colors':profileColorsPage,'player-delete':playerDeleteScreen,
    'bermuda-number':()=>title('MATCH SETUP','Bermuda Triangle','Choose the target for the next round.')+
      '<div class="segments">'+Array.from({length:20},(_,i)=>button('bermuda-target:'+(i+1),i+1,'rule')).join('')+
      button('bermuda-target:25','Bull','rule')+button('bermuda-target:any','Any','rule')+'</div>',
    'bermuda-multiplier':()=>title('MATCH SETUP','Required multiplier')+'<div class="rules">'+
      ['Any multiplier','Single','Double','Triple'].map((label,i)=>button('bermuda-m:'+i,label,'rule',
        state.bermudaTarget===25&&i===3)).join('')+'</div>',
    rounds:()=>title('MATCH SETUP','Rounds','Choose the match length.')+'<div class="letters">'+
      Array.from({length:30},(_,i)=>button('round-count:'+(i+1),i+1,'rule')).join('')+'</div>',
    menu:matchOptionsScreen,'match-leave-confirm':matchLeaveConfirmScreen,
    saved:savedMatchScreen,'saved-discard-confirm':savedDiscardScreen,
    players:playersManager,
    settings:settingsHome,
    'settings-network':settingsNetwork,'settings-wifi-password':settingsWifiPassword,'settings-system':settingsSystem,about:aboutConsole};
  // Keep the encoder selection stable across redraws. A score update may
  // disable the previously selected throw slot, so prefer the next free dart.
  const previousAction=controls()[state.cursor]?.dataset.action;
  main.innerHTML=views[state.page]()+ (state.message?note(state.message):'');
  if(state.page==='game')fitMainScore();
  renderFooter();
  const available=controls();
  const sameAction=previousAction && available.findIndex(b=>b.dataset.action===previousAction);
  if(sameAction!==undefined && sameAction>=0){
    state.cursor=sameAction;
  }else if(state.page==='game'){
    const nextDart=available.findIndex(b=>b.dataset.action==='throw');
    state.cursor=nextDart>=0?nextDart:Math.min(state.cursor,available.length-1);
  }
  highlight(scroll);
}
function controls(){return [...document.querySelectorAll('[data-nav]:not(:disabled)')].filter(b=>b.offsetParent)}
function highlight(scroll){
  const available=controls();
  state.cursor=available.length?Math.max(0,Math.min(state.cursor,available.length-1)):0;
  document.querySelectorAll('button.focused').forEach(b=>b.classList.remove('focused'));
  // The home screen is operated exclusively with its four physical keys.
  // No rotary selection exists, so none of its tiles should be highlighted.
  if(state.page==='home'||(state.page.startsWith('stats')&&!['stats-players','stats-history'].includes(state.page)))return;
  if(state.page==='profile-icons'||state.page==='profile-colors'){
    const desired=state.page==='profile-icons'?state.editIcon:state.editColor;
    state.cursor=desired;
    available.forEach((b,i)=>b.classList.toggle('focused',i===desired));
    return;
  }
  if(state.page==='players'){
    state.selectedProfile=available.length?Math.max(0,Math.min(state.selectedProfile,available.length-1)):0;
    state.cursor=state.selectedProfile;
    available.forEach((b,i)=>b.classList.toggle('focused',i===state.selectedProfile));
    if(scroll&&available[state.selectedProfile])available[state.selectedProfile].scrollIntoView({block:'nearest'});
    return;
  }
  available.forEach((b,i)=>b.classList.toggle('focused',i===state.cursor));
  if(scroll && available[state.cursor])available[state.cursor].scrollIntoView({block:'nearest'});
}
function shuffle(values){
  const result=[...values];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function say(message){
  state.message=message;
  render();
  main.lastElementChild.scrollIntoView({block:'nearest'});
}
function begin(){
  const n=state.players.length;
  if(n<Scoring.minimum(state.chosen)||n>20||(state.chosen==='Tic-Tac-Toe'&&n!==2)){
    say(state.chosen==='Tic-Tac-Toe'?'Select exactly two players.':'Select '+Scoring.minimum(state.chosen)+' to 20 players.');
    return;
  }
  if(state.chosen==='Bermuda Triangle'&&!state.sequence.length) return say('Add the house round sequence first.');
  if(state.chosen==='Tic-Tac-Toe'&&state.grid.length!==9) return say('Choose nine distinct grid targets.');
  const players=shuffle(state.players);
  let numbers;
  if(state.chosen==='Killer'){
    if(!state.selfHit) return say('Choose the rule for hitting your own number.');
    numbers=state.manualNumbers?players.map(name=>state.numbers[name]):shuffle(Array.from({length:20},(_,i)=>i+1)).slice(0,n);
    if(numbers.includes(undefined)||new Set(numbers).size!==n) return say('Choose a unique number for every player.');
  }
  parkMatch();
  data.active=Scoring.start(state.chosen,players,{out:state.out,rounds:state.rounds,bull:state.bull,
    grid:[...state.grid], sequence:[...state.sequence], numbers, selfHit:state.selfHit});
  save();
  show('game');
}
function showThrowFeedback(n,m){
  // Called after a genuine recorded dart, not when navigating or correcting history.
  const existing=document.querySelector('.throw-flash');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.className='throw-flash';
  overlay.setAttribute('role','status');
  const inner=document.createElement('div');
  inner.className='throw-flash-inner';
  const lead=document.createElement('div');
  lead.className='throw-flash-label';
  lead.textContent='LAST DART';
  const hit=document.createElement('div');
  hit.className='throw-flash-hit';
  hit.textContent=Scoring.label(n,m);
  // Size each hit label to fit the physical portrait screen. A three-character
  // T20 can remain huge; "Inner bull" must never run off either edge.
  const hitText=hit.textContent;
  const measure=document.createElement('canvas').getContext('2d');
  if(measure){
    const maxWidth=Math.max(120,window.innerWidth*.84);
    const fontFamily=getComputedStyle(document.body).fontFamily;
    const spacing=-.055;
    let lo=24,hi=Math.min(490,window.innerHeight*.40);
    for(let i=0;i<22;i++){
      const mid=(lo+hi)/2;
      measure.font='750 '+mid+'px '+fontFamily;
      const width=measure.measureText(hitText).width+
        spacing*mid*Math.max(0,hitText.length-1);
      // flashIn scales to 1.06 at its peak; reserve space for that as well.
      if(width*1.09<=maxWidth)lo=mid;
      else hi=mid;
    }
    hit.style.fontSize=lo.toFixed(1)+'px';
  }
  const points=document.createElement('div');
  points.className='throw-flash-points';
  const mode=data.active?.mode;
  const amount=n*m;
  if(['301','501','701'].includes(mode)){
    // A busted turn restores the starting score; do not suggest points were deducted.
    const replay=derived();
    points.textContent=replay.notice?.includes(' busted')?'BUST · NO SCORE':'−'+amount+' POINTS';
  } else if(mode==='Around the Clock'){
    points.textContent=amount?'TARGET HIT':'MISS';
  } else if(mode==='Killer'||mode==='Knockout'){
    points.textContent=amount?'HIT RECORDED':'MISS';
  } else {
    points.textContent='+'+amount+' POINTS';
  }
  inner.append(lead,hit,points);
  overlay.append(inner);
  document.body.appendChild(overlay);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(()=>overlay.remove(),700);
  else overlay.addEventListener('animationend',e=>{if(e.target===overlay)overlay.remove()},{once:true});
}
function openThrow(index=null){
  if(index===null&&turnReview())return;
  state.edit=index;
  state.number=undefined;
  show('segment');
}
function clickHitAction(n,m){
  if(!data.active)return;
  const previousWinner=derived().winners;
  const newThrow=state.edit===null;
  if(newThrow)return recordMatchDart(n,m);
  clearTurnReview();
  Scoring.correct(data.active,state.edit,n,m);
  save();
  show('game');
  announceVictory(previousWinner);
}
function clickButton(b){
  if(!b||b.disabled)return;
  state.cursor=Math.max(0,controls().indexOf(b));
  const [action,...pieces]=b.dataset.action.split(':');
  const value=pieces.join(':');
  state.message='';
  switch(action){
    case 'home':return show('home');
    case 'settings-scoring':return show('settings'); 
    case 'checkout-toggle':
      state.settingsCheckoutOpen=!state.settingsCheckoutOpen;
      if(state.settingsCheckoutOpen)state.settingsDisplayOpen=false;
      render(false);
      if(state.settingsCheckoutOpen){
        const active=controls().findIndex(b=>b.dataset.action==='checkout-select:'+encodeURIComponent(data.out));
        if(active>=0){state.cursor=active;highlight(true);}
      }
      return;
    case 'checkout-select':
      if(!Scoring.checkouts.includes(decodeURIComponent(value)))return;
      data.out=decodeURIComponent(value);
      state.out=data.out;
      state.settingsCheckoutOpen=false;
      save();
      state.cursor=0;
      return render(false);
    case 'settings-display':return show('settings'); 
    case 'display-toggle':
      state.settingsDisplayOpen=!state.settingsDisplayOpen;
      if(state.settingsDisplayOpen)state.settingsCheckoutOpen=false;
      state.cursor=controls().findIndex(b=>b.dataset.action==='display-toggle');
      return render(false);
    case 'setting-clarity':
      if(!['Dezent','Standard','Klar'].includes(value))return;
      data.display.clarity=value;
      data.display.highContrast=value==='Klar';
      save();return render(false);
    case 'settings-network':show('settings-network');return refreshWifi();
    case 'settings-system':return show('settings-system');
    case 'setting-motion':data.display.reducedMotion=!data.display.reducedMotion;save();break;
    case 'setting-contrast':data.display.clarity=data.display.clarity==='Klar'?'Standard':'Klar';data.display.highContrast=data.display.clarity==='Klar';save();break;
    case 'wifi-refresh':return refreshWifi();
    case 'wifi-select':
      state.networkSsid=decodeURIComponent(value);
      state.networkPassword='';
      state.networkKeyboardMode=0;
      if(state.network.networks?.some(n=>n.ssid===state.networkSsid&&!n.security))return connectWifi();
      return show('settings-wifi-password');
    case 'wifi-char':
      if(state.networkPassword.length<63)state.networkPassword+=decodeURIComponent(value);
      return render(false);
    case 'wifi-connect':return connectWifi();
    case 'mode-info':return show('mode-info');
    case 'stats-player':
      state.statsPlayer=decodeURIComponent(value);
      return show('stats-player-detail');
    case 'stats-match':
      state.statsMatchNumber=Number(value);
      return show('stats-match-detail');
    case 'quick': case 'all':
      state.filter=action;
      if(action==='quick'&&!modes.slice(0,6).some(m=>m[0]===state.chosen)) state.chosen='501';
      break;
    case 'mode':return selectMode(value);
    case 'discard':
      if(data.active?.mode===state.chosen) data.active=null;
      delete data.unfinished[state.chosen];
      save();
      return show('setup');
    case 'bermuda-target':
      state.bermudaTarget=value==='any'?undefined:Number(value);
      return show('bermuda-multiplier');
    case 'bermuda-m':
      state.sequence.push({n:state.bermudaTarget,m:Number(value)});
      return show('setup');
    case 'remove-round':state.sequence.splice(Number(value),1);break;
    case 'player':{
      normalizeSetupPlayers();
      const actual=[...data.profiles,...state.guests].find(p=>p.toLocaleUpperCase('de-DE')===value.toLocaleUpperCase('de-DE'));
      if(!actual)return;
      state.players=state.players.includes(actual)?state.players.filter(p=>p!==actual):[...state.players,actual];
      break;
    }
    case 'guest':return addSetupGuest();
    case 'select-profile':
      state.selectedProfile=Number(value);
      state.cursor=state.selectedProfile;
      return render(false);
    case 'new-profile':return newPlayer();
    case 'choose-icon':state.editIcon=Number(value);return render(false);
    case 'choose-color':state.editColor=Number(value);return render(false);
    case 'letter':if(state.name.length<24) state.name+=value.toLocaleUpperCase('de-DE'); break;
    case 'erase':state.name=state.name.slice(0,-1); break;
    case 'profile-save':return savePlayerProfile();
    case 'out':state.out=value;break;
    case 'update-start':
      if(state.updateBusy)return;
      state.updateConfirm=true;
      return render();
    case 'update-cancel':
      state.updateConfirm=false;
      return render();
    case 'update-confirm':
      return startSoftwareUpdate();
    case 'default-out':
      data.out=Scoring.checkouts[(Scoring.checkouts.indexOf(data.out)+1)%3];
      state.out=data.out;save();break;
    case 'bull':state.bull=!state.bull;break;
    case 'round-count':state.rounds=Number(value);return show('setup');
    case 'grid':if(state.grid.length===9)state.grid=[];return show('grid');
    case 'clear-grid':state.grid=[];return show('grid');
    case 'killer-assignment':state.manualNumbers=!state.manualNumbers;break;
    case 'self-hit':state.selfHit=state.selfHit==='Ignore'?'Lose lives':'Ignore';break;
    case 'number':state.numberPlayer=value;return show('number');
    case 'target':
      if(state.page==='grid'){
        state.grid.push(Number(value));
        return show(state.grid.length===9?'setup':'grid');
      }
      state.numbers[state.numberPlayer]=Number(value);
      return show('setup');
    case 'begin':return begin();
    case 'match-save-exit':return leaveMatch(true);
    case 'match-leave-confirm':return show('match-leave-confirm');
    case 'match-discard':return leaveMatch(false);
    case 'throw':return openThrow();
    case 'edit':return openThrow(Number(value));
    case 'segment':state.number=Number(value);return show('segment');
    case 'hit': {
      const [n,m]=value.split(',').map(Number);
      return clickHitAction(n,m);
    }
    case 'next':{
      if(!turnReview())return;
      clearTurnReview();save();return show('game');
    }
    case 'finished-home':{
      parkMatch();
      save();
      return show('home');
    }
    case 'rematch':{
      const old=data.active;
      parkMatch();
      data.active=Scoring.start(old.mode,[...old.players],{...old.options});
      save();show('game');return;
    }
    default:return show(action,action==='play');
  }
  render();
}
document.addEventListener('click',event=>{
  const shortcut=event.target.closest('[data-shortcut]');
  if(shortcut) return runShortcut(shortcut.dataset.shortcut);

const back={'saved-discard-confirm':'saved','match-leave-confirm':'menu','mode-info':'play',play:'home',players:'home',stats:'home','stats-players':'stats','stats-player-detail':'stats-players','stats-records':'stats','stats-history':'stats','stats-match-detail':'stats-history','stats-delete-confirm':'stats-match-detail',settings:'home','settings-scoring':'settings','settings-display':'settings','settings-network':'settings','settings-wifi-password':'settings-network','settings-system':'settings',setup:'play',game:'menu',menu:'game',correction:'game',rounds:'setup',grid:'setup',number:'setup',
  saved:'play',about:'settings',profile:'players','profile-icons':'profile','profile-colors':'profile-icons','player-delete':'players','bermuda-number':'setup','bermuda-multiplier':'bermuda-number'};
document.addEventListener('keydown',event=>{
  const key=event.key;
  if(!['ArrowUp','ArrowDown','Enter','Escape','F2','F4','F5'].includes(key))return;
  event.preventDefault();
  if(event.repeat&&key!=='ArrowUp'&&key!=='ArrowDown') return;
  if((state.page==='home'||state.page==='mode-info'||(state.page.startsWith('stats')&&!['stats-players','stats-history'].includes(state.page)))&&(key==='ArrowUp'||key==='ArrowDown'||key==='Enter'))return;
  if(key==='ArrowUp'||key==='ArrowDown'){
    const items=controls();
    if(!items.length)return;
    state.cursor=(state.cursor+(key==='ArrowUp'?-1:1)+items.length)%items.length;
    const selected=items[state.cursor]?.dataset.action;
    if(state.page==='players'){
      state.selectedProfile=state.cursor;
      highlight(true);
      return;
    }
    if(state.page==='profile-icons'||state.page==='profile-colors'){
      if(state.page==='profile-icons')state.editIcon=state.cursor;
      else state.editColor=state.cursor;
      render(false);
      return;
    }
    if(state.page==='play'&&selected?.startsWith('mode:')&&state.chosen!==selected.slice(5)){
      state.chosen=selected.slice(5);
      render(true);
    } else highlight(true);
  } else if(key==='Enter') clickButton(controls()[state.cursor]);
  else runShortcut(key);
});
render();
if(state.page==='play'){
  state.cursor=controls().findIndex(b=>b.classList.contains('chosen'));
  highlight(false);
}
const intro=document.querySelector('.darts-intro');
intro?.addEventListener('animationend',event=>{if(event.animationName==='dartsIntroExit')intro.remove()});
