<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darts Console – Offline Demo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f5f5f5;background:#10151b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(800px,100%);background:#1c242d;border:1px solid #39444e;border-radius:20px;padding:28px}h1{margin:0 0 10px}p{color:#aebac5}button{font:inherit;background:#293542;border:1px solid #526274;color:#fff;border-radius:10px;padding:13px;margin:5px;cursor:pointer}.selected{outline:3px solid #e7ae47;background:#405065}.muted{color:#aebac5}#status{margin-top:20px;padding:12px;background:#121920;border-radius:10px}small{color:#aebac5}.players{display:flex;flex-wrap:wrap}.score{font-size:2.6rem;font-weight:700}hr{border:0;border-top:1px solid #39444e}
</style></head><body><main><h1>🎯 Darts Console</h1><p>Offline-Bedienungsdemo · Drehregler = ↑/↓ + Enter · Zurück = Esc · Korrektur = F2 · Menü = F3</p><div id="screen"></div><div id="status" aria-live="polite"></div><small>Demo ohne Kameraerkennung. Die Spiel- und Trefferlogik ist noch nicht produktionsreif.</small></main>
<script>
const permanent=['Emre','Arber','Adnan','Atakan','Amir','Ali'];
const state={page:'mode',mode:501,out:'Double Out',players:['Arber','Emre'],cursor:0,guest:0,turn:0,throws:[],scores:[],message:''};
const root=document.querySelector('#screen'),status=document.querySelector('#status');
let options=[];
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function setPage(page){state.page=page;state.cursor=0;render()}
function item(label,fn){options.push({label,fn});return '<button data-idx="'+(options.length-1)+'" class="'+(state.cursor===options.length-1?'selected':'')+'">'+label+'</button>'}
function render(){options=[];let html='';
if(state.page==='mode'){html='<h2>Spielmodus</h2>';for(const m of [301,501,701])html+=item(m+' Punkte',()=>{state.mode=m;setPage('out')});html+='<p>Cricket folgt in einer späteren Version.</p>'}
if(state.page==='out'){html='<h2>Checkout-Regel</h2>';for(const o of ['Single Out','Double Out','Master Out'])html+=item(o,()=>{state.out=o;setPage('players')})}
if(state.page==='players'){html='<h2>Spieler auswählen</h2><p>Ausgewählt: '+state.players.join(', ')+'</p><div class="players">';for(const p of permanent)html+=item((state.players.includes(p)?'✓ ':'')+p,()=>{state.players=state.players.includes(p)?state.players.filter(x=>x!==p):[...state.players,p];render()});html+='</div>';html+=item('+ Gast',()=>{state.players.push('Gast '+(++state.guest));render()});html+=item('Spiel starten',()=>{if(state.players.length<1){state.message='Mindestens ein Spieler erforderlich';render();return}state.players=shuffled(state.players);state.scores=state.players.map(()=>state.mode);state.turn=0;state.throws=[];setPage('game')})}
if(state.page==='game'){html='<h2>'+state.mode+' · '+state.out+'</h2><p>Zufällige Reihenfolge: '+state.players.join(' → ')+'</p><h3>Aktuell: '+state.players[state.turn]+'</h3><div class="score">'+state.scores[state.turn]+'</div><hr>';state.players.forEach((p,i)=>html+='<p>'+p+': <strong>'+state.scores[i]+'</strong></p>');html+=item('Korrektur (F2)',()=>setPage('correction'));html+=item('Menü (F3)',()=>setPage('menu'));html+='<p>Treffer kommen später automatisch über die Kameras.</p>'}
if(state.page==='correction'){html='<h2>Treffer korrigieren</h2><p>Die Auswahl eines historischen Wurfs und die komplette Neuberechnung folgen mit der Scoring-Engine.</p>';html+=item('Zurück zum Spiel',()=>setPage('game'))}
if(state.page==='menu'){html='<h2>Menü</h2>';html+=item('Spiel fortsetzen',()=>setPage('game'));html+=item('Neues Spiel',()=>setPage('mode'))}
root.innerHTML=html;status.textContent=state.message||'Bereit';root.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.cursor=Number(b.dataset.idx);options[state.cursor].fn()});const selected=root.querySelector('.selected');selected?.scrollIntoView({block:'nearest'})}
function move(delta){if(!options.length)return;state.cursor=(state.cursor+delta+options.length)%options.length;render()}
document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Enter','Escape','F2','F3'].includes(e.key))e.preventDefault();if(e.key==='ArrowDown')move(1);else if(e.key==='ArrowUp')move(-1);else if(e.key==='Enter')options[state.cursor]?.fn();else if(e.key==='Escape'){if(state.page==='game')setPage('menu');else if(state.page==='correction'||state.page==='menu')setPage('game');else if(state.page==='players')setPage('out');else if(state.page==='out')setPage('mode')}else if(e.key==='F2'&&state.page==='game')setPage('correction');else if(e.key==='F3'&&state.page==='game')setPage('menu')});render();
</script></body></html>
