<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171715">
<title>Darts Console</title>
<style>:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;background:#171715;color:#f4f1e9;--accent:#e9a268;--line:#3c3b36;--muted:#b5b2a8}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
.console{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#171715}
header{display:flex;align-items:center;min-height:clamp(70px,10vw,108px);padding:0 4.4vw;flex-shrink:0}
.brand{font-weight:650;font-size:clamp(21px,3.3vw,36px);letter-spacing:-.05em;display:flex;align-items:center;gap:14px}
.brand-mark{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.workspace{display:flex;flex-direction:column;flex:1;min-height:0}
nav{display:flex;margin:0 4.4vw;border-bottom:1px solid var(--line);flex-shrink:0;gap:2vw}
.nav{position:relative;border:0;background:transparent;color:var(--muted);padding:22px 12px;min-height:76px;flex:1;font-size:clamp(14px,2.2vw,24px);font-weight:550}
.nav.active{color:#f4f1e9}
.nav.active:after{content:"";position:absolute;bottom:-1px;left:12px;right:12px;height:3px;background:var(--accent)}
main{min-height:0;min-width:0;flex:1;padding:4.4vw;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
main::-webkit-scrollbar{display:none}
h1{font-size:clamp(32px,6vw,66px);font-weight:600;letter-spacing:-.055em;line-height:1.08;margin:10px 0 18px}
.eyebrow{color:var(--muted);font-size:clamp(11px,1.7vw,18px);font-weight:550;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:clamp(16px,2.3vw,25px);line-height:1.45;margin:0 0 32px}
.home-heading{display:flex;align-items:end;justify-content:space-between;margin:1vw 0 3.2vw}
.home-heading h1{margin:0;font-size:clamp(40px,7.5vw,81px)}
.home-heading p{color:var(--muted);font-size:clamp(14px,2.1vw,23px);margin:0 0 .6vw}
.switch{display:flex;gap:12px;margin-bottom:24px}
.switch button{border:1px solid var(--line);background:transparent;padding:14px 24px;border-radius:50px;font-size:clamp(14px,2vw,22px);font-weight:550}
.switch button.on{background:#eeebe2;border-color:#eeebe2;color:#272720}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:clamp(155px,22vw,238px);padding:clamp(20px,3vw,34px);text-align:left;border:1px solid #46453f;border-radius:6px;background:#252521;overflow:hidden}
.tile strong{font-size:clamp(26px,4.4vw,48px);font-weight:600;letter-spacing:-.05em;line-height:1.04;max-width:92%}
.tile.numeric strong{font-size:clamp(55px,9vw,98px);font-weight:550;letter-spacing:-.07em}
.tile small{font-size:clamp(14px,2vw,22px);color:var(--muted);margin-top:12px}
.tile .tile-arrow{position:absolute;right:25px;top:19px;color:#99978e;font-size:32px;font-weight:400}
.tile.chosen{border-color:#a49c8d}
.tile.focused{background:#eee9dc;color:#25251f;outline:none!important;border-color:#eee9dc}
.tile.focused small,.tile.focused .tile-arrow{color:#59564d}
.home-summary{display:flex;gap:24px;align-items:baseline;border-top:1px solid var(--line);padding-top:24px;margin-top:32px;color:var(--muted);font-size:clamp(16px,2.2vw,24px);line-height:1.5}
.home-summary strong{color:#f4f1e9;white-space:nowrap;font-weight:550}
.home-summary p{margin:0}
.primary,.action,.player,.rule{border:1px solid #515047;background:#292923;border-radius:6px;font-size:clamp(17px,2.25vw,25px);padding:20px;font-weight:550}
.primary{width:100%;min-height:clamp(60px,8vw,88px);background:var(--accent);border-color:var(--accent);color:#221b14;font-weight:650}
.action{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:14px;gap:16px;min-height:72px}
.action span,.player span{color:var(--accent)}
.action.resume{background:transparent;margin-bottom:28px;border-color:#746049}
.panel{padding:26px;border:1px solid var(--line);border-radius:6px;background:#21211d;margin-bottom:24px}
.panel h2{font-size:clamp(20px,2.65vw,29px);font-weight:550;margin:0 0 22px;letter-spacing:-.025em}
.panel p,.note{color:var(--muted);font-size:clamp(16px,2.2vw,24px);line-height:1.5}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{display:flex;align-items:center;justify-content:space-between;text-align:left;min-width:0;overflow-wrap:anywhere}
.player.checked,.rule.checked{background:#40382c;border-color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule{text-align:center;min-height:66px}
.segments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:10px}
.note{padding:18px;border-left:3px solid var(--accent);background:#29271f;margin:24px 0}
.focused{outline:3px solid var(--accent);outline-offset:-3px}
.primary.focused{outline-color:#3f291a;outline-offset:-6px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
footer{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:8px;min-height:clamp(76px,10vw,108px);border-top:1px solid var(--line);padding:14px 3vw;flex-shrink:0;background:#1c1c18}
.hint{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(11px,1.6vw,18px);font-weight:550;color:#c4c1b6;white-space:nowrap}
.hint small{display:none}
.key{display:grid;place-items:center;border:1px solid #5c5a50;border-radius:5px;width:34px;height:34px;font-size:20px;color:#e7e2d7}
.key.round{border-radius:50%;border-color:var(--accent);color:var(--accent)}
.console[data-view="game"] nav{display:none}
.game-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
.game-heading h1{margin-bottom:0}
.game-meta{color:var(--muted);font-size:clamp(16px,2.2vw,24px);text-align:right}
.score-hero{background:#eae6db;color:#262720;padding:3.6vw;border-radius:6px;margin-bottom:24px;min-height:59vw;display:grid;grid-template-rows:auto auto 1fr auto auto}
.pill{font-size:clamp(12px,1.6vw,18px);letter-spacing:.08em;font-weight:650}
.score-hero strong{font-size:clamp(35px,6vw,66px);letter-spacing:-.04em;margin-top:16px;font-weight:600}
.big-score{font-size:clamp(100px,23vw,252px);letter-spacing:-.04em;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums;align-self:center}
.word-score{font-size:15vw}
.caption{font-size:clamp(12px,1.7vw,19px);letter-spacing:.08em;color:#5f5e53;font-weight:600}
.dart-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.dart-slots div{padding:16px 8px;border:1px solid #b9b6a8;text-align:center;font-size:clamp(20px,3vw,33px);font-weight:650;border-radius:5px}
.dart-slots small{display:block;color:#68675a;font-size:clamp(11px,1.5vw,17px);margin-bottom:8px;letter-spacing:.08em}
.dart-slots .empty{color:#a39f91;border-style:dashed}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-bottom:1px solid var(--line);font-size:clamp(18px,2.6vw,29px)}
.score-row:last-child{border:0}
.score-row.active{background:#353126;border-radius:5px}
.score-row strong{font-size:clamp(22px,3.3vw,36px);font-weight:600}
.score-row.active strong{color:var(--accent)}
.marks{display:block;font-size:.7em;line-height:1.5;color:var(--muted);margin-top:6px}
.standings h2{font-size:18px;color:var(--muted)}
.match-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-actions button{margin:0}
.match-actions .primary,.match-actions .action:last-child:nth-child(even){grid-column:1/-1}
@media(max-width:600px){
  nav{gap:0}.nav{padding:15px 4px;min-height:56px}
  main{padding:5vw}.home-heading{align-items:start;flex-direction:column;gap:12px}
  .switch button{padding:10px 16px}.cards{gap:10px}.tile{padding:18px}.tile .tile-arrow{right:15px;top:10px;font-size:24px}
  .home-summary{gap:14px}.action,.rule,.player{padding:14px}.panel{padding:18px}
  .rules{gap:8px}.hint{flex-direction:column;gap:5px}.key{width:25px;height:25px;font-size:16px}
  .game-heading{gap:10px}.score-hero{padding:24px;min-height:390px}.dart-slots{gap:8px}
}
@media(prefers-reduced-motion:no-preference){
  button{transition:background-color 120ms,color 120ms,border-color 120ms}
}</style>
</head>
<body>
<div class="console">
<header>
<div class="brand"><span class="brand-mark" aria-hidden="true"></span>Darts Console</div></header>
<div class="workspace"><nav id="nav" aria-label="Main navigation"></nav><main id="main"></main></div>
<footer aria-label="Physical button labels">
<div class="hint"><span class="key">↶</span><span>BACK<small>Esc</small></span></div>
<div class="hint"><span class="key">↩</span><span>UNDO<small>F4</small></span></div>
<div class="hint"><span class="key round">●</span><span>ROTATE / OK<small>Arrows · Enter</small></span></div>
<div class="hint"><span class="key">✎</span><span>CORRECT<small>F2</small></span></div>
<div class="hint"><span class="key">➜</span><span>NEXT<small>F5</small></span></div>
</footer>
</div>
<script src="scoring.js"></script>
<script>
const shapes={
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
users:'<circle cx="9" cy="7" r="4"/><path d="M2 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M16 4a4 4 0 0 1 0 7.5M18 14a5 5 0 0 1 4 5v1"/>',
chart:'<path d="M4 20v-6M10 20V9M16 20V4M22 20v-8"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-3 2v3l3 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 3-2v-3L1 9l2-4 3 1 3-1Z"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
trophy:'<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4ZM7 6H4v3a4 4 0 0 0 4 4M17 6h3v3a4 4 0 0 1-4 4"/>',
dart:'<path d="m5 19 14-14M13 5l6-2-2 6M5 19l-2 2 2-6M15 9l-4-4"/>',
crossed:'<path d="m5 19 14-14M19 19 5 5M13 5l6-2-2 6M5 5 3 3l6 2"/>',
arrows:'<path d="M4 7h16m-5-4 5 4-5 4M20 17H4m5-4-5 4 5 4"/>',
flame:'<path d="M12 22c4 0 7-3 7-7 0-3-2-6-5-9 .3 3-1 4-2 5-.5-3-1.5-5-3-7-1 4-4 7-4 11 0 4 3 7 7 7Z"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
ball:'<circle cx="12" cy="12" r="9"/><path d="M7 5c3 3 3 11 0 14M17 5c-3 3-3 11 0 14"/>',
percent:'<path d="M19 5 5 19"/><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/>',
triangle:'<path d="m12 3 10 18H2L12 3Z"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(shapes[name]||shapes.target)+'</svg>'}
const modes=[
['501','The classic','dart',501,'CLASSIC','Start at 501 and count down to exactly zero. Double Out is optional.'],
['Cricket','Tactical darts','crossed',0,'TACTICAL','Close 15 to 20 and bull while keeping your score ahead.'],
['Around the Clock','Hit 1 through 20','clock',0,'PRACTICE','Hit the numbers from 1 through 20 in order.'],
['High Score','Collect points','trophy',0,'EASY','Get the highest total over a fixed number of rounds.'],
['Baseball','9 innings','ball',0,'EASY','Each inning uses one target. Singles, doubles and triples score runs.'],
['Knockout','Last player standing','users',0,'PARTY','Outscore the previous player or lose a life.'],
['301','Quick countdown','target',301,'CLASSIC','A shorter countdown game: get to exactly zero.'],
['701','Longer matches','target',701,'CLASSIC','A longer countdown game for bigger matches.'],
['Killer','Everyone vs everyone','users',0,'PARTY','Become a killer and take lives from the other players.'],
['Shanghai','Precision counts','flame',0,'SKILL','Score on the current target. Hit a single, double and triple to win.'],
['Gotcha!','Reset your rivals','arrows',0,'PARTY','Reach 301 and reset opponents with a matching score.'],
['Halve-It','Avoid missing','percent',0,'SKILL','Miss the target three times and your running score is halved.'],
['Bermuda Triangle','Changing targets','triangle',0,'SKILL','A target-changing game with special rounds.'],
['Tic-Tac-Toe','Three in a row','grid',0,'TACTICAL','Claim three squares in a row by hitting target numbers.']
];
if(new URLSearchParams(location.search).has('kiosk'))document.body.classList.add('kiosk');
const defaults=['Emre','Arber','Adnan','Atakan','Amir','Ali'];
const storage='darts-console-v1';
let data={profiles:defaults, matches:[], active:null, out:'Double Out'};
try {
  const previous=JSON.parse(localStorage.getItem(storage));
  if(previous) data={...data,...previous};
} catch (error) {
  console.warn('Unable to load console state',error);
}
const state={page:'play',filter:'quick',chosen:'501',players:['Arber','Emre'],
  guests:[], cursor:0, message:'', out:data.out, rounds:10, bull:false, grid:[], sequence:[], numbers:{}, selfHit:null};
const nav=document.getElementById('nav'),main=document.getElementById('main');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentMode=()=>modes.find(mode=>mode[0]===state.chosen);
const derived=()=>Scoring.replay(data.active);
const title=(top,heading,sub='')=>'<div class="eyebrow">'+top+'</div><h1>'+heading+'</h1><p class="subtitle">'+sub+'</p>';
const note=text=>'<div class="note" role="status">'+esc(text)+'</div>';
const button=(action,label,cls='action',disabled=false)=>'<button data-nav class="'+cls+'" data-action="'+
  esc(action)+'" '+(disabled?'disabled':'')+'>'+label+'</button>';
const panel=(heading,children)=>'<section class="panel"><h2>'+heading+'</h2>'+children+'</section>';

function save(){
  try {localStorage.setItem(storage,JSON.stringify(data))}
  catch {state.message='Storage unavailable. Progress is available until this page closes.'}
}
function show(page,withNav=false){
  state.page=page;
  const fullScore=page==='game'&&matchMedia('(orientation:portrait) and (min-width:480px)').matches;
  state.cursor=withNav||fullScore?0:5;
  state.message='';
  render(true);
}
function cards(){
  const shown=state.filter==='quick'?modes.slice(0,6):modes;
  const mode=currentMode();
  return '<div class="home-heading"><h1>Let’s play.</h1><p>Choose your game.</p></div>'+
    (data.active?button('game','Resume '+esc(data.active.mode)+'<span>Continue →</span>','action resume'):'')+
    '<div class="switch">'+button('quick','Quick play',state.filter==='quick'?'on':'')+
    button('all','All games',state.filter==='all'?'on':'')+'</div><div class="cards">'+
    shown.map(m=>button('mode:'+m[0],'<span class="tile-arrow" aria-hidden="true">↗</span><strong>'+
      m[0]+'</strong><small>'+m[1]+'</small>',
      'tile '+(m===mode?'chosen ':'')+(m[3]?'numeric':''))).join('')+'</div>'+
    '<div class="home-summary"><strong>'+mode[0]+'</strong><p>'+mode[5]+'</p></div>';
}
function setup(){
  const mode=currentMode();
  const selected=state.players;
  let html=title('MATCH SETUP',mode[0],'Player order is randomized at the start.');
  html+=panel('Players · '+selected.length+' selected','<div class="players">'+
    [...data.profiles,...state.guests].map(name=>button('player:'+name,esc(name)+'<span>'+
      (selected.includes(name)?'✓':'+')+'</span>','player '+(selected.includes(name)?'checked':''))).join('')+
    '</div><br>'+button('guest','Add guest <span>＋</span>'));
  if(mode[3]) html+=panel('Checkout','<div class="rules">'+Scoring.checkouts.map(out=>
    button('out:'+out,out,'rule '+(state.out===out?'checked':''))).join('')+'</div>');
  if(mode[0]==='Around the Clock') html+=button('bull','Final bull <span>'+(state.bull?'On':'Off')+'</span>');
  if(mode[0]==='High Score') html+=button('rounds','Rounds <span>'+state.rounds+'</span>');
  if(mode[0]==='Tic-Tac-Toe') html+=button('grid','Choose nine grid targets <span>'+state.grid.length+'/9</span>');
  if(mode[0]==='Bermuda Triangle') html+=panel('House round sequence',
    note('No default round sequence is specified. Add the targets and required multipliers in order.')+
    state.sequence.map((target,i)=>button('remove-round:'+i,'Round '+(i+1)+' · '+roundTarget(target)+' <span>Remove</span>')).join('')+
    button('bermuda-number','Add round','action',state.sequence.length>=30));
  if(mode[0]==='Killer') {
    html+=panel('Killer house rules',button('killer-assignment','Number assignment <span>'+
      (state.manualNumbers?'Manual':'Random')+'</span>')+
      button('self-hit','Hit your own number <span>'+esc(state.selfHit??'Choose')+'</span>')+
      (state.manualNumbers?selected.map(name=>button('number:'+name,esc(name)+' <span>'+
        (state.numbers[name]??'Choose')+'</span>')).join(''):'')+
      '<p>Hits on eliminated targets are ignored.</p>');
  }
  return html+button('begin','Start match','primary');
}
function picker(){
  const choosingGrid=state.page==='grid';
  const available=Array.from({length:20},(_,i)=>i+1).filter(n=>
    !choosingGrid || !state.grid.includes(n));
  return title('MATCH SETUP',choosingGrid?'Choose square '+(state.grid.length+1):esc(state.numberPlayer),
    choosingGrid?'Choose the target numbers in row order.':'Choose a unique Killer target.')+
    '<div class="rules">'+available.map(n=>button('target:'+n,n,'rule')).join('')+'</div>'+
    (choosingGrid?'<br>'+button('clear-grid','Clear grid'):'');
}
function roundTarget(target){
  const number=target.n===undefined?'Any number':target.n===25?'Bull':target.n;
  return number+' · '+({1:'Single',2:'Double',3:'Triple'}[target.m]??'Any multiplier');
}
function game(){
  const match=data.active, view=derived(), p=view.players[view.current];
  const finished=view.winners!==null;
  const mode=match.mode;
  const modeScore=player=>{
    if(mode==='Around the Clock') return player.target>20?(match.options.bull&&player.target===21?'Bull':'Done'):player.target;
    if(['Killer','Knockout'].includes(mode)) return player.lives;
    return player.score;
  };
  const unit=mode==='Around the Clock'?'NEXT TARGET':['Killer','Knockout'].includes(mode)?'LIVES':
    mode==='Baseball'?'RUNS':mode==='Tic-Tac-Toe'?'SQUARES':Number(mode)?'POINTS REMAINING':'POINTS';
  let extra=mode==='Bermuda Triangle'?' · '+roundTarget(match.options.sequence[view.round-1]):'';
  if(['Halve-It','Shanghai','Baseball'].includes(mode)){
    const target=mode==='Halve-It'?[20,19,18,17,16,15,'Bull'][view.round-1]:view.round;
    extra=' · Target '+target;
  }
  let html='<div class="game-heading"><div><div class="eyebrow">'+
    (finished?'MATCH COMPLETE':'MATCH IN PROGRESS')+'</div><h1>'+esc(mode)+
    '</h1></div><div class="game-meta">Round '+view.round+extra+
    (Number(mode)?'<br>'+esc(match.options.out):'')+'</div></div>';
  if(finished) html+=panel('Result','<p>'+esc(view.winners.length?view.winners.map(i=>view.players[i].name).join(' & '):'Draw')+'</p>');
  else html+='<div class="score-hero"><span class="pill">NOW THROWING</span><strong>'+esc(p.name)+
    '</strong><div class="big-score'+(typeof modeScore(p)==='string'?' word-score':'')+'">'+modeScore(p)+
    '</div><div class="caption">'+unit+'</div><div class="dart-slots">'+[0,1,2].map(i=>
      '<div class="'+(view.darts[i]?'':'empty')+'"><small>DART '+(i+1)+'</small>'+
      (view.darts[i]?Scoring.label(view.darts[i].n,view.darts[i].m):'—')+'</div>').join('')+'</div></div>';
  html+='<section class="panel standings"><h2>Standings</h2>'+view.players.map((player,i)=>
    '<div class="score-row '+(!finished&&i===view.current?'active':'')+'"><span>'+esc(player.name)+
    (mode==='Killer'?' · #'+player.number+' · '+((player.marks[player.number]??0)===3?'Killer':(player.marks[player.number]??0)+'/3'):'')+
    (!player.active?' · Out':'')+(mode==='Cricket'?'<small class="marks">'+[15,16,17,18,19,20,25].map(n=>
      (n===25?'B':n)+' '+(player.marks[n]??0)+'/3').join(' · ')+'</small>':'')+
    '</span><strong>'+modeScore(player)+'</strong></div>').join('')+'</section>';
  if(mode==='Tic-Tac-Toe') html+='<div class="rules">'+match.options.grid.map((n,i)=>
    '<div class="rule">'+n+' · '+esc(view.owners[i]===null?'Open':view.players[view.owners[i]].name)+'</div>').join('')+'</div><br>';
  if(view.notice) html+=note(view.notice);
  if(view.skipped) html+=note(view.skipped+' recorded event(s) no longer fit after a correction. Open Corrections to review.');
  html+='<div class="match-actions">';
  if(!finished) html+=button('throw','Enter throw','primary')+
    button('next','End turn <span>›</span>');
  html+=button('correction','Correct an earlier throw <span>›</span>')+
    button('menu','Match menu <span>›</span>')+'</div>';
  return html;
}
function segment(){
  if(state.number!==undefined){
    return title('MANUAL SCORING','Select multiplier','Target '+(state.number===25?'Bull':state.number))+
      '<div class="rules">'+(state.number===25?[1,2]:[1,2,3]).map(m=>
        button('hit:'+state.number+','+m,Scoring.label(state.number,m),'rule')).join('')+'</div>';
  }
  return title('MANUAL SCORING',state.edit===null?'Enter a throw':'Replace a throw','Select the board target.')+
    '<div class="segments">'+Array.from({length:20},(_,i)=>button('segment:'+(i+1),i+1,'rule')).join('')+
    button('segment:25','Bull','rule')+button('hit:0,0','Miss','rule')+'</div>';
}
function history(){
  const match=data.active, accepted=new Set(derived().history.map(d=>d.index));
  return title('MATCH HISTORY','Correct a throw','Select the recorded dart you want to replace.')+
    (match.events.map((event,i)=>event.type==='throw'?button('edit:'+i,
      'R'+event.round+' · '+esc(match.players[event.player])+' · Dart '+(event.slot+1)+
      '<span>'+Scoring.label(event.n,event.m)+(accepted.has(i)?'':' · Skipped')+'</span>'):'').reverse().join('')||note('No recorded throws yet.'))+
    button('game','Back to match');
}
function statistics(){
  const matches=[...data.matches,...(data.active&&derived().winners!==null?[data.active]:[])];
  const totals=new Map(data.profiles.map(name=>[name,{played:0,won:0,points:0,darts:0}]));
  const summaries=matches.map(match=>{
    const view=Scoring.replay(match);
    if(view.winners===null) return '';
    const winner=view.winners.map(i=>match.players[i]).join(' & ')||'Draw';
    match.players.forEach((name,i)=>{
      const total=totals.get(name);
      if(!total) return;
      total.played++;
      if(view.winners.includes(i)) total.won++;
      view.history.filter(d=>d.player===i).forEach(d=>{total.darts++;total.points+=d.n*d.m});
    });
    return '<div class="score-row"><span>'+esc(match.mode)+' · '+esc(new Date(match.started).toLocaleDateString())+
      '<small class="marks">'+esc(match.players.join(', '))+'</small></span><strong>'+esc(winner)+'</strong></div>';
  });
  return title('RESULTS','Statistics','Completed matches and recorded dart averages.')+
    panel('Players',[...totals].map(([name,t])=>'<div class="score-row"><span>'+esc(name)+
      '</span><span>'+t.won+' / '+t.played+' wins · '+(t.darts?(3*t.points/t.darts).toFixed(1):'—')+' per 3 darts</span></div>').join(''))+
    panel('Match history',summaries.reverse().join('')||'<p>No completed matches yet.</p>');
}
function profileEditor(){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 -';
  return title('PLAYERS','New player',esc(state.name||'Use the encoder to select characters.'))+
    '<div class="letters">'+[...chars].map(c=>button('letter:'+c,c===' '?'Space':c,'rule')).join('')+'</div><br>'+
    button('erase','Erase last character')+button('profile-save','Save player','primary');
}
function render(scroll=false){
  document.querySelector('.console').dataset.view=state.page;
  const pages=[['play','Play','target'],['players','Players','users'],['stats','Statistics','chart'],
    ['settings','Settings','settings'],['about','About','info']];
  const active=state.page==='profile'?'players':pages.some(p=>p[0]===state.page)?state.page:'play';
  nav.innerHTML=pages.map(([key,label,shape])=>button(key,label,'nav '+(key===active?'active':''))).join('');
  const views={play:cards,setup,game,segment,correction:history,grid:picker,number:picker,stats:statistics,
    profile:profileEditor,
    'bermuda-number':()=>title('MATCH SETUP','Bermuda Triangle','Choose the target for the next round.')+
      '<div class="segments">'+Array.from({length:20},(_,i)=>button('bermuda-target:'+(i+1),i+1,'rule')).join('')+
      button('bermuda-target:25','Bull','rule')+button('bermuda-target:any','Any','rule')+'</div>',
    'bermuda-multiplier':()=>title('MATCH SETUP','Required multiplier')+'<div class="rules">'+
      ['Any multiplier','Single','Double','Triple'].map((label,i)=>button('bermuda-m:'+i,label,'rule',
        state.bermudaTarget===25&&i===3)).join('')+'</div>',
    rounds:()=>title('MATCH SETUP','Rounds','Choose the match length.')+'<div class="letters">'+
      Array.from({length:30},(_,i)=>button('round-count:'+(i+1),i+1,'rule')).join('')+'</div>',
    menu:()=>title('MATCH OPTIONS','Match menu')+button('game','Resume match')+button('play','Game library'),
    replace:()=>title('MATCH SETUP','Replace current match?',derived().winners?'The result will be kept in match history.':'The unfinished match will be removed.')+
      button('begin-confirm','Start new match')+button('setup','Back to setup'),
    players:()=>title('PLAYER LIST','Players','Saved profiles')+panel('Profiles','<div class="players">'+data.profiles.map(name=>
      '<div class="player">'+esc(name)+'</div>').join('')+'</div>')+button('new-profile','Add player'),
    settings:()=>title('CONSOLE','Settings')+panel('Scoring',button('default-out','Default checkout <span>'+esc(data.out)+'</span>')+
      '<p>Manual entry is available from the match screen.</p>'),
    about:()=>title('CONSOLE','About')+panel('Darts Console','<p>Offline darts scoring for a portrait display and Raspberry Pi Pico controls.</p>')};
  main.innerHTML=views[state.page]()+ (state.message?note(state.message):'');
  highlight(scroll);
}
function controls(){return [...document.querySelectorAll('[data-nav]:not(:disabled)')].filter(b=>b.offsetParent)}
function highlight(scroll){
  const available=controls();
  state.cursor=Math.min(state.cursor,available.length-1);
  available.forEach((b,i)=>b.classList.toggle('focused',i===state.cursor));
  if(scroll) available[state.cursor]?.scrollIntoView({block:'nearest'});
}
function shuffle(values){
  const result=[...values];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function say(message){
  state.message=message;
  render();
  main.lastElementChild.scrollIntoView({block:'nearest'});
}
function begin(confirm=false){
  const n=state.players.length;
  if(n<Scoring.minimum(state.chosen)||n>20||(state.chosen==='Tic-Tac-Toe'&&n!==2)){
    say(state.chosen==='Tic-Tac-Toe'?'Select exactly two players.':'Select '+Scoring.minimum(state.chosen)+' to 20 players.');
    return;
  }
  if(state.chosen==='Bermuda Triangle'&&!state.sequence.length) return say('Add the house round sequence first.');
  if(state.chosen==='Tic-Tac-Toe'&&state.grid.length!==9) return say('Choose nine distinct grid targets.');
  const players=shuffle(state.players);
  let numbers;
  if(state.chosen==='Killer'){
    if(!state.selfHit) return say('Choose the rule for hitting your own number.');
    numbers=state.manualNumbers?players.map(name=>state.numbers[name]):shuffle(Array.from({length:20},(_,i)=>i+1)).slice(0,n);
    if(numbers.includes(undefined)||new Set(numbers).size!==n) return say('Choose a unique number for every player.');
  }
  if(data.active&&!confirm) return show('replace');
  if(data.active&&derived().winners!==null) data.matches.push(data.active);
  data.active=Scoring.start(state.chosen,players,{out:state.out,rounds:state.rounds,bull:state.bull,
    grid:[...state.grid], sequence:[...state.sequence], numbers, selfHit:state.selfHit});
  save();
  show('game');
}
function openThrow(index=null){
  state.edit=index;
  state.number=undefined;
  show('segment');
}
function clickButton(b){
  if(!b||b.disabled)return;
  state.cursor=Math.max(0,controls().indexOf(b));
  const [action,...pieces]=b.dataset.action.split(':');
  const value=pieces.join(':');
  state.message='';
  switch(action){
    case 'quick': case 'all':
      state.filter=action;
      if(action==='quick'&&!modes.slice(0,6).some(m=>m[0]===state.chosen)) state.chosen='501';
      break;
    case 'mode':state.chosen=value;return show('setup');
    case 'bermuda-target':
      state.bermudaTarget=value==='any'?undefined:Number(value);
      return show('bermuda-multiplier');
    case 'bermuda-m':
      state.sequence.push({n:state.bermudaTarget,m:Number(value)});
      return show('setup');
    case 'remove-round':state.sequence.splice(Number(value),1);break;
    case 'player':
      state.players=state.players.includes(value)?state.players.filter(p=>p!==value):[...state.players,value];
      break;
    case 'guest': {
      let number=state.guests.length+1;
      while([...data.profiles,...state.guests].includes('Guest '+number)) number++;
      state.guests.push('Guest '+number);
      state.players.push(state.guests.at(-1));
      break;
    }
    case 'new-profile':state.name='';return show('profile');
    case 'letter':if(state.name.length<24) state.name+=value; break;
    case 'erase':state.name=state.name.slice(0,-1); break;
    case 'profile-save': {
      const name=state.name.trim();
      if(!name||[...data.profiles,...state.guests].some(n=>n.toLowerCase()===name.toLowerCase())) return say('Enter a unique player name.');
      data.profiles.push(name);
      save();
      return show('players');
    }
    case 'out':state.out=value;break;
    case 'default-out':
      data.out=Scoring.checkouts[(Scoring.checkouts.indexOf(data.out)+1)%3];
      state.out=data.out;save();break;
    case 'bull':state.bull=!state.bull;break;
    case 'round-count':state.rounds=Number(value);return show('setup');
    case 'grid':if(state.grid.length===9)state.grid=[];return show('grid');
    case 'clear-grid':state.grid=[];return show('grid');
    case 'killer-assignment':state.manualNumbers=!state.manualNumbers;break;
    case 'self-hit':state.selfHit=state.selfHit==='Ignore'?'Lose lives':'Ignore';break;
    case 'number':state.numberPlayer=value;return show('number');
    case 'target':
      if(state.page==='grid'){
        state.grid.push(Number(value));
        return show(state.grid.length===9?'setup':'grid');
      }
      state.numbers[state.numberPlayer]=Number(value);
      return show('setup');
    case 'begin':return begin();
    case 'begin-confirm':return begin(true);
    case 'throw':return openThrow();
    case 'edit':return openThrow(Number(value));
    case 'segment':state.number=Number(value);return show('segment');
    case 'hit': {
      const [n,m]=value.split(',').map(Number);
      if(state.edit===null) Scoring.record(data.active,n,m);
      else Scoring.correct(data.active,state.edit,n,m);
      save();
      return show('game');
    }
    case 'next':Scoring.next(data.active);save();return show('game');
    default:return show(action,action==='play');
  }
  render();
}
document.addEventListener('click',event=>{
  const b=event.target.closest('button[data-nav]');
  if(b) clickButton(b);
});
const back={setup:'play',game:'menu',menu:'game',correction:'game',rounds:'setup',grid:'setup',number:'setup',
  replace:'setup',profile:'players','bermuda-number':'setup','bermuda-multiplier':'bermuda-number'};
document.addEventListener('keydown',event=>{
  const key=event.key;
  if(!['ArrowUp','ArrowDown','Enter','Escape','F2','F4','F5'].includes(key))return;
  event.preventDefault();
  if(event.repeat&&key!=='ArrowUp'&&key!=='ArrowDown') return;
  if(key==='ArrowUp'||key==='ArrowDown'){
    const items=controls();
    state.cursor=(state.cursor+(key==='ArrowUp'?-1:1)+items.length)%items.length;
    const selected=items[state.cursor]?.dataset.action;
    if(state.page==='play'&&selected?.startsWith('mode:')&&state.chosen!==selected.slice(5)){
      state.chosen=selected.slice(5);
      render(true);
    } else highlight(true);
  } else if(key==='Enter') clickButton(controls()[state.cursor]);
  else if(key==='Escape'){
    if(state.page==='segment'){
      if(state.number!==undefined){state.number=undefined;return show('segment')}
      return show(state.edit===null?'game':'correction');
    }
    show(back[state.page]||'play',state.page==='play');
  } else if(state.page==='game'){
    if(key==='F2') show('correction');
    else if(key==='F4'){Scoring.undo(data.active);save();show('game')}
    else if(key==='F5'&&!derived().winners){Scoring.next(data.active);save();show('game')}
  }
});
render();
if(state.page==='play'){
  state.cursor=controls().findIndex(b=>b.classList.contains('chosen'));
  highlight(false);
}
</script>
</body>
</html>
